name: Capture the A13 joint repair input

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-snaps.trigger']

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: b90d04b0f476d865aacaf99b19123e12ddef4a3f
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Capture
        run: |
          cd autorouter
          git apply --include='tests/fixtures/assets/a13-via-without-site/*' ../harness-repo/harness/ar-exp/via-repro-v1.patch
          bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/a13-capture-joint.ts .
          mkdir -p ../out
          bun a13-capture-joint.ts tests/fixtures/assets/a13-via-without-site/remaining64.srj.json.gz ../out/a13-contact-repair-via-clearance.json.gz
      - name: Push the fixture to a branch
        run: |
          cd harness-repo
          git config user.name harness-bot; git config user.email harness-bot@users.noreply.github.com
          git checkout -q --orphan fixtures/a13-contact-repair; git rm -rq --cached .; git clean -fdq
          cp ../out/a13-contact-repair-via-clearance.json.gz .
          git add a13-contact-repair-via-clearance.json.gz; git commit -qm "A13 joint repair input"
          git push -f origin fixtures/a13-contact-repair
