name: Autorouter no-via-site mark, snapshots and same-runner timing

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-snaps.trigger']

jobs:
  snaps:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 7d8e63c573589261bd56f567c022adfb97c70233
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Write snapshots, then run against them
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          git apply ../harness-repo/harness/ar-exp/via-site-fraction.patch
          mapfile -t F < ../harness-repo/harness/ar-exp/fail-files.txt
          BUN_UPDATE_SNAPSHOTS=1 bun test "${F[@]}" --timeout 1800000 > s1.log 2>&1 || true
          grep -E "^ *[0-9]+ (pass|fail)$" s1.log
          bun test "${F[@]}" --timeout 1800000 > s2.log 2>&1 || true
          grep -E "^ *[0-9]+ (pass|fail)$|^\(fail\)" s2.log
          git status --short
          echo "=====TARBALL-BEGIN====="
          tar -czf - $(git status --short | grep "__snapshots__" | awk '{print $2}') | base64 -w 160
          echo "=====TARBALL-END====="
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 7d8e63c573589261bd56f567c022adfb97c70233
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Time base then fix on one runner
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/h616-full.ts ../harness-repo/harness/diag/a13-count.ts .
          for v in base fix base2 fix2; do
            git checkout -q lib
            case $v in fix*) git apply ../harness-repo/harness/ar-exp/via-site-fraction.patch;; esac
            bun h616-full.ts $v > h.log 2>&1 || true; grep -E "^H616 $v solved" h.log | cut -c1-120
            bun a13-count.ts $v > a.log 2>&1 || true; grep -E "^A13" a.log | cut -c1-120
            start=$(date +%s); bun test tests/bugs/bugreport110/motherboard-power-full-route.test.ts --timeout 1800000 > m.log 2>&1 || true; end=$(date +%s)
            echo "MOTHERBOARD $v seconds=$((end-start)) $(grep -E '^\((pass|fail)\)' m.log | cut -c1-60)"
          done
          git clean -fdq lib
