# Temporary remote runner for the A13 investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: A13 capture on core main

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a13:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: aeb7e465abc1680051e06f1c84ddc1e9166be07d
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --ignore-scripts
      - name: Route A13
        run: |
          grep -E "core-ddr-benchmark|bus-lanes-solver|capacity-autorouter" package.json
          bun run benchmark:ddr --circuit a13 --timeout 900
      - name: Print the results (artifact downloads are not reachable from the review session)
        if: always()
        run: |
          cat ddr-benchmark-results/report.md
          echo "=====TARBALL-BEGIN====="
          tar -C ddr-benchmark-results -czf - . | base64 -w 160
          echo "=====TARBALL-END====="
