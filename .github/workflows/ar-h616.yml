name: Via-site stack failing tests, repro vs fix

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-h616.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [repro, fix]
        test: [tests/repro/pipeline9-a13-via-without-legal-site.test.ts]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 2436c416110fb917a90219ea312086bfa14807a6
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/via-${{ matrix.variant }}-v1.patch
          bun install > /dev/null 2>&1
          start=$(date +%s)
          timeout 2400 bun test ${{ matrix.test }} --timeout 9999999 > t.log 2>&1 && code=0 || code=$?
          echo "DONE ${{ matrix.variant }} exit=$code seconds=$(($(date +%s)-start))"
          grep -vE "^\s+at " t.log | grep -E "error|Expected|Received|expect\(|toEqual|toBe|\(pass\)|\(fail\)|differs|matches|^\s+[-+] |^\s+\"" | cut -c1-250 | head -60
