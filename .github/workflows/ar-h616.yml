name: Autorouter H616 full board and motherboard, base vs split

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-h616.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [base, fix]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 7d8e63c573589261bd56f567c022adfb97c70233
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          if [ "${{ matrix.variant }}" = fix ]; then git apply ../harness-repo/harness/ar-exp/via-site-fraction.patch; fi
          cp ../harness-repo/harness/diag/h616-full.ts ../harness-repo/harness/diag/a13-count.ts .
          bun a13-count.ts ${{ matrix.variant }} > a.log 2>&1 || true
          grep -E "^A13" a.log | cut -c1-500; tail -3 a.log | cut -c1-300
          bun h616-full.ts ${{ matrix.variant }} > h.log 2>&1 || true
          grep -E "^H616" h.log | cut -c1-500; tail -3 h.log | cut -c1-300
          start=$(date +%s); bun test tests/bugs/bugreport110/motherboard-power-full-route.test.ts --timeout 900000 > m.log 2>&1 || true; end=$(date +%s)
          echo "MOTHERBOARD ${{ matrix.variant }} seconds=$((end-start)) $(grep -E '^\((pass|fail)\)' m.log | cut -c1-120)"
