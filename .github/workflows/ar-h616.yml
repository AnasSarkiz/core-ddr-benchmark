name: Autorouter H616 full board and motherboard, base vs split

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-h616.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        only: [none, cmn_281]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 8da00b27530a97bc6e1d76b2bedd96e8c9087ad5
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          git apply ../harness-repo/harness/ar-exp/split-nodes.patch
          python3 ../harness-repo/harness/ar-exp/split-only.py
          cp ../harness-repo/harness/diag/node281.ts .
          SPLIT_ONLY=${{ matrix.only }} bun node281.ts only-${{ matrix.only }} > h.log 2>&1 || true
          grep -E "^N281" h.log | cut -c1-1300
          tail -5 h.log
