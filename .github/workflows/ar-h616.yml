name: H616 full-board errors by cleanup gate

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-h616.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [main, fix, fix-norefine, fix-noproj, fix-nosafe]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ed52af82d5a58845bd199f14777475e7c0e054ed
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          V=${{ matrix.variant }}
          if [ "$V" != main ]; then git apply ../harness-repo/harness/ar-exp/fix-v11.patch; fi
          F=lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9RegionalB01RepairSolver.ts
          if [ "$V" = fix-norefine ]; then perl -0pi -e 's/rejectNewContacts: true/rejectNewContacts: false/' $F; fi
          if [ "$V" = fix-nosafe ]; then perl -0pi -e 's/(rejectNewContacts: true.*?)rejectNewContacts: true/$1rejectNewContacts: false/s' $F; fi
          if [ "$V" = fix-noproj ]; then perl -0pi -e 's/if \(!introducesPipeline9DrcContact\(errors, cleanup\.errors\)\)/if (true)/' $F; fi
          git diff --stat -- $F
          bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/h616-drc.ts .
          bun h616-drc.ts $V > d.log 2>&1 || true
          grep -E "^H616" d.log | cut -c1-260; tail -3 d.log | cut -c1-300
