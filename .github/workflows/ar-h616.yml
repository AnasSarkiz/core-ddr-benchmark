name: high-density-repair03 tests, main vs contact repair fix

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-h616.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: [c0325f34982b62d901b9bd3a45696121a903de30, 4a2e6589e2ea387303407e7ea8d72643fb386a08]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/high-density-repair03
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Test
        run: |
          bun install > /dev/null 2>&1
          bunx tsc --noEmit > tsc.log 2>&1 && echo "TSC exit=0" || { echo "TSC failed"; head -20 tsc.log; }
          bunx biome format . > fmt.log 2>&1 && echo "FMT exit=0" || { echo "FMT failed"; grep -A30 "Formatter would" fmt.log | head -40; }
          bun test --timeout 9999999 > t.log 2>&1 || true
          echo "REF ${{ matrix.ref }}"; grep -E "^ *[0-9]+ (pass|fail)$|^\(fail\)" t.log | cut -c1-200
