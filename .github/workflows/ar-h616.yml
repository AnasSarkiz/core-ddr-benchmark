name: Autorouter H616 full board and motherboard, base vs split

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-h616.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [none, split, scale, both]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 7d8e63c573589261bd56f567c022adfb97c70233
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          git apply ../harness-repo/harness/ar-exp/split-nodes.patch
          python3 ../harness-repo/harness/ar-exp/via-site-cost.py
          cp ../harness-repo/harness/diag/h616-full.ts ../harness-repo/harness/diag/a13-count.ts .
          export VIA_SITE_MODE=${{ matrix.mode }}
          bun a13-count.ts ${{ matrix.mode }} > a.log 2>&1 || true
          grep -E "^(A13|VIASITE)" a.log | cut -c1-500; tail -3 a.log | cut -c1-300
          bun h616-full.ts ${{ matrix.mode }} > h.log 2>&1 || true
          grep -E "^(H616|VIASITE)" h.log | head -2 | cut -c1-500; tail -3 h.log | cut -c1-300
