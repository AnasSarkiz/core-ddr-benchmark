name: H616 full-board determinism, main vs fix

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-h616.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [main, fix]
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ed52af82d5a58845bd199f14777475e7c0e054ed
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          if [ "${{ matrix.variant }}" = fix ]; then git apply ../harness-repo/harness/ar-exp/fix-v11.patch; fi
          bun install > /dev/null 2>&1
          T=tests/repro/pipeline9-h616-full-board-ddr-clearance.test.ts
          S=tests/repro/__snapshots__/pipeline9-h616-full-board-ddr-clearance.snap.svg
          echo "COMMITTED ${{ matrix.variant }} $(sha256sum $S | cut -c1-16)"
          bun test $T --timeout 9999999 > t.log 2>&1 || true
          echo "RESULT ${{ matrix.variant }}-${{ matrix.attempt }} $(grep -E 'snapshot (matches|differs)|^\((pass|fail)\)' t.log | cut -c1-140 | tr '\n' ' ')"
          BUN_UPDATE_SNAPSHOTS=1 bun test $T --timeout 9999999 > u.log 2>&1 || true
          echo "OUTPUT ${{ matrix.variant }}-${{ matrix.attempt }} $(sha256sum $S | cut -c1-16)"
          echo "=====SNAP ${{ matrix.variant }}-${{ matrix.attempt }}====="; base64 -w0 $S; echo; echo "=====END====="
