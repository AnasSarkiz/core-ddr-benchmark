name: Autorouter failing files with full output

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-fails.trigger']

jobs:
  fails:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 8da00b27530a97bc6e1d76b2bedd96e8c9087ad5
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Apply the fix
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          bun install --ignore-scripts --cwd tests/repro/orangecrab-via-roundoff > /dev/null 2>&1
          git apply ../harness-repo/harness/ar-exp/split-nodes.patch
      - name: Run
        run: |
          cd autorouter
          cp -r ../harness-repo/harness/ar-overlay/. .
          sed -i 's|  expect(viaPadErrors.length).toBeGreaterThan(0)|  expect(viaPadErrors).toEqual([])|' tests/repro/pipeline9-a13-via-without-legal-site.test.ts
          if [ "${{ matrix.part }}" = 0 ]; then
            cp ../harness-repo/harness/diag/split-count.ts .
            bun split-count.ts ../harness-repo/harness/diag/a13-remaining-v60.json.gz > ff.log 2>&1 || true
            for f in tests/repro/pipeline9-h616-full-board-ddr-clearance.test.ts tests/repro/pipeline9-a13-via-without-legal-site.test.ts; do echo "########## $f" >> ff.log; bun test "$f" --timeout 900000 >> ff.log 2>&1 || true; done
          else
            for f in tests/bugs/bugreport110/motherboard-power-full-route.test.ts tests/repro/pipeline9-a13-declared-trace-clearance.test.ts; do echo "########## $f" >> ff.log; bun test "$f" --timeout 900000 >> ff.log 2>&1 || true; done
          fi
      - name: Emit
        if: always()
        run: |
          cd autorouter
          grep -vE "^\s+at |^\s*[0-9]+ \||^bun test v" ff.log | grep -E "^SPLIT|^SPLITNODE|^##########|^\((pass|fail)\)|error:|Expected|Received|differ|toBe|toEqual" | cut -c1-240 | head -300
