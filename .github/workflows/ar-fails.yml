name: Autorouter fix, failing tests with snapshots rewritten

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-fails.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, s4]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 7d8e63c573589261bd56f567c022adfb97c70233
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          bun install --ignore-scripts --cwd tests/repro/orangecrab-via-roundoff > /dev/null 2>&1
          git apply ../harness-repo/harness/ar-exp/via-site-fraction.patch
          sed -i 's|  expect(viaPadErrors.length).toBeGreaterThan(0)|  expect(viaPadErrors).toEqual([])|' tests/repro/pipeline9-a13-via-without-legal-site.test.ts
          if [ "${{ matrix.shard }}" = s4 ]; then
            NODE_COUNT=9 bun scripts/generate-balanced-test-plan.ts > /dev/null 2>&1
            mapfile -t files < .bun-test-plan/testplans/testplan4.txt
            for f in "${files[@]}"; do
              bun test "$f" --timeout 300000 > t.log 2>&1 || true
              if grep -qE "^\(fail\)|^error|Unhandled" t.log; then echo "########## $f"; grep -vE "^\s+at " t.log | grep -E "^\(fail\)|^error|Unhandled|Expected|Received" | head -8 | cut -c1-220; fi
            done
            exit 0
          fi
          i=0
          while read -r f; do
            if [ $((i % 6)) -eq ${{ matrix.shard }} ]; then
              BUN_UPDATE_SNAPSHOTS=1 bun test "$f" --timeout 1800000 > t.log 2>&1 || true
              echo "########## $f $(grep -cE '^\(pass\)' t.log) pass $(grep -cE '^\(fail\)' t.log) fail"
              grep -vE "^\s+at |^bun test v" t.log | grep -E "^error|Expected|Received|^\s+[-+] |toBe|toEqual|toBeLessThan|toBeGreaterThan" | head -12 | cut -c1-220
            fi
            i=$((i+1))
          done < ../harness-repo/harness/ar-exp/fail-files.txt
          echo "=====SNAPTEXT====="
          for s in $(git status --short | grep "__snapshots__" | awk '{print $2}'); do
            old=$(git show HEAD:"$s" 2>/dev/null | grep -oE "<text[^>]*>[^<]*</text>" | sed -E 's/<[^>]+>//g' | grep -iE "error|via|drc|clearance|trace|[0-9]" | tr '\n' '|' | cut -c1-300)
            new=$(grep -oE "<text[^>]*>[^<]*</text>" "$s" | sed -E 's/<[^>]+>//g' | grep -iE "error|via|drc|clearance|trace|[0-9]" | tr '\n' '|' | cut -c1-300)
            echo "SNAP $s"; echo "  OLD $old"; echo "  NEW $new"
          done
