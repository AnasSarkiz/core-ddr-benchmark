name: Pipeline 9 on Core-main remaining phases

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-fails.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        circuit: [a64, h3, stmp157, a13]
        input: [coremain]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: dc19141bc92b21a52cb42aced8699e7ddb978924
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/phase-fail.ts .
          gunzip -c ../harness-repo/harness/phase-inputs/${{ matrix.circuit }}-${{ matrix.input }}.srj.json.gz > in.srj.json
          bun phase-fail.ts in.srj.json ${{ matrix.circuit }}/${{ matrix.input }} > p.log 2>&1 || true
          grep -E "^PHASE" p.log | cut -c1-600; tail -3 p.log | cut -c1-300
