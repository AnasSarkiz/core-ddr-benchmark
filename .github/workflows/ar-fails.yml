name: Autorouter failing files with full output

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-fails.trigger']

jobs:
  fails:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 8da00b27530a97bc6e1d76b2bedd96e8c9087ad5
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Apply the fix
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          bun install --ignore-scripts --cwd tests/repro/orangecrab-via-roundoff > /dev/null 2>&1
          git apply ../harness-repo/harness/ar-exp/split-nodes.patch
      - name: Run
        run: |
          cd autorouter
          i=0
          while read -r f; do
            if [ $((i % 3)) -eq ${{ matrix.part }} ]; then
              echo "########## $f" >> ff.log
              bun test "$f" --timeout 900000 >> ff.log 2>&1 || true
            fi
            i=$((i+1))
          done < ../harness-repo/harness/ar-exp/failfiles.txt
      - name: Emit
        if: always()
        run: |
          cd autorouter
          grep -vE "^\s+at |^\s*[0-9]+ \||^bun test v" ff.log | grep -E "^##########|^\((pass|fail)\)|error:|Expected|Received|snapshot|Snapshot|differ|toBe|toEqual|^- |^\+ " | cut -c1-240 | head -300
