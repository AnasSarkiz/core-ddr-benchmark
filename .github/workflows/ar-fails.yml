name: Trace where joint repair adds A13 via-to-pad violations

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-fails.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fixture: [via-repro]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: b90d04b0f476d865aacaf99b19123e12ddef4a3f
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Trace
        run: |
          cd autorouter
          git apply --include='tests/fixtures/assets/a13-via-without-site/*' ../harness-repo/harness/ar-exp/via-repro-v1.patch
          bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/a13-joint-via.ts .
          F=tests/fixtures/assets/a13-fixed-copper/remaining64.srj.json.gz
          if [ "${{ matrix.fixture }}" = via-repro ]; then F=tests/fixtures/assets/a13-via-without-site/remaining64.srj.json.gz; fi
          bun a13-joint-via.ts $F ${{ matrix.fixture }} > j.log 2>&1 || true
          grep -E "^(JOINT tcr counts|TCR)" j.log | cut -c1-400 | head -80; tail -3 j.log | cut -c1-300
