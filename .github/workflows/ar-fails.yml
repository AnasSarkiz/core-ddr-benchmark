name: Main, repro snapshots and fix snapshots

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-fails.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        part: [repro, fix0, fix1, fix2, fix3]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: bfc6509a20959b11ebdea7e38d7fb5fe0fef2097
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          bun install --ignore-scripts --cwd tests/repro/orangecrab-via-roundoff > /dev/null 2>&1
          git apply ../harness-repo/harness/ar-exp/repro-tests.patch
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm repro
          A=tests/repro/pipeline9-a13-via-without-legal-site.test.ts
          if [ "${{ matrix.part }}" = repro ]; then
            FORCE_BUN_UPDATE_SNAPSHOTS=1 BUN_UPDATE_SNAPSHOTS=1 bun test $A --timeout 1800000 > t.log 2>&1 || true; grep -E "^\((pass|fail)\)|^error" t.log
            bun test $A --timeout 1800000 > t.log 2>&1 || true; grep -E "^\((pass|fail)\)|^error" t.log
            git status --short | grep -v "\.log$"
            for s in $(git status --short | grep "__snapshots__" | awk '{print $2}'); do echo "SNAP $s :: $(grep -oE "<text[^>]*>[^<]*</text>" "$s" | sed -E 's/<[^>]+>//g' | tr '\n' '|' | cut -c1-200)"; done
            echo "=====OUT-BEGIN====="; tar -czf - $(git status --short | grep "__snapshots__" | awk '{print $2}') | base64 -w 160; echo "=====OUT-END====="
            exit 0
          fi
          git apply ../harness-repo/harness/ar-exp/fix-code.patch
          k=${{ matrix.part }}; k=${k#fix}; i=0
          while read -r f; do
            if [ $((i % 4)) -eq $k ]; then
              FORCE_BUN_UPDATE_SNAPSHOTS=1 BUN_UPDATE_SNAPSHOTS=1 bun test "$f" --timeout 1800000 > t.log 2>&1 || true
              bun test "$f" --timeout 1800000 > t2.log 2>&1 || true
              echo "########## $f update:$(grep -cE '^\(fail\)' t.log)fail rerun:$(grep -cE '^\(pass\)' t2.log)pass/$(grep -cE '^\(fail\)' t2.log)fail"
              grep -vE "^\s+at " t2.log | grep -E "^error|Expected|Received" | head -6 | cut -c1-200
            fi
            i=$((i+1))
          done < ../harness-repo/harness/ar-exp/fail-files.txt
          for s in $(git status --short | grep "__snapshots__" | awk '{print $2}'); do
            old=$(git show HEAD:"$s" 2>/dev/null | grep -oE "<text[^>]*>[^<]*</text>" | sed -E 's/<[^>]+>//g' | tr '\n' '|' | cut -c1-220)
            new=$(grep -oE "<text[^>]*>[^<]*</text>" "$s" | sed -E 's/<[^>]+>//g' | tr '\n' '|' | cut -c1-220)
            if cmp -s <(git show HEAD:"$s") "$s"; then continue; fi
            echo "SNAP $s"; echo "  OLD $old"; echo "  NEW $new"
          done
          echo "=====OUT-BEGIN====="; tar -czf - $(git status --short | grep "__snapshots__" | awk '{print $2}') | base64 -w 160; echo "=====OUT-END====="
