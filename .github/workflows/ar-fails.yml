name: Pipeline 9 on a phase input

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-fails.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        input: [butterstick-matching-remaining]
        effort: [2, 4]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: main
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter && git log --oneline -1 && bun install > /dev/null 2>&1
          sed -i 's/effort: Math.min(1, pipeline.effort),/effort: pipeline.effort,/' lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/getPipeline9PortPointPathingInput.ts && git diff --stat
          cp ../harness-repo/harness/diag/phase-fail.ts ../harness-repo/harness/diag/planner-stuck.ts .
          gunzip -c ../harness-repo/harness/phase-inputs/${{ matrix.input }}.srj.json.gz > in.srj.json
          timeout 3000 bun planner-stuck.ts in.srj.json ${{ matrix.effort }} > p.log 2>&1 || true
          grep -E "^STUCK (pipelineError|planner|tinyPipeline|solveGraph (iterations|ripCount))" p.log | cut -c1-400; tail -2 p.log | cut -c1-300
          timeout 3000 bun phase-fail.ts in.srj.json uncapped-effort${{ matrix.effort }} ${{ matrix.effort }} > q.log 2>&1 || true
          grep -E "^PHASE .*(solved=|error=|failingStage)" q.log | cut -c1-400
