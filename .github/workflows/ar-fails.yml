name: Pipeline 9 on a phase input

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-fails.trigger']

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        input: [butterstick-matching-remaining-bytesonly]
        effort: [1]
        ref: [main]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ${{ matrix.ref }}
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter && git log --oneline -1 && bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/hd-node.ts .
          gunzip -c ../harness-repo/harness/phase-inputs/${{ matrix.input }}.srj.json.gz > in.srj.json
          mkdir -p out; timeout 1500 bun hd-node.ts in.srj.json out > q.log 2>&1 || true
          grep -E "^HD" q.log | cut -c1-400; tail -3 q.log | cut -c1-300
      - name: Push node
        if: always()
        run: |
          cd harness-repo
          git config user.name harness-bot; git config user.email harness-bot@users.noreply.github.com
          git checkout -q --orphan diag/bs-hd-node; git rm -rq --cached .; git clean -fdq
          cp ../autorouter/out/* . 2>/dev/null; touch empty; git add -A && git commit -qm node && git push -f origin HEAD
