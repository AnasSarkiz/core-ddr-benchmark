name: Trace A13 vias through Pipeline 9 stages

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-fails.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 2436c416110fb917a90219ea312086bfa14807a6
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Trace
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/via-repro-v1.patch
          bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/a13-via-trace.ts .
          bun a13-via-trace.ts > t.log 2>&1 || true
          grep -E "^TRACE" t.log | cut -c1-260; tail -3 t.log | cut -c1-250
