name: Pipeline 9 on a phase input

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-fails.trigger']

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        input: [butterstick-matching-remaining-bytesonly, butterstick-matching-remaining, butterstick-routing-remaining]
        effort: [1]
        ref: [main, refs/pull/4158/head, refs/pull/4168/head]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ${{ matrix.ref }}
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter && git log --oneline -1 && bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/phase-fail.ts .
          gunzip -c ../harness-repo/harness/phase-inputs/${{ matrix.input }}.srj.json.gz > in.srj.json
          timeout 1500 bun phase-fail.ts in.srj.json ${{ matrix.input }} 1 > q.log 2>&1 || true
          grep -E "^PHASE .*(solved=|error=)" q.log | cut -c1-300
