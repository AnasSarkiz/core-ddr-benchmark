name: Pipeline 9 on a phase input

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-fails.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        input: [butterstick-routing-remaining, butterstick-matching-remaining, butterstick-matching-remaining-bytesonly]
        effort: [1]
        ref: [main, 93818dcfe4b9174c4cf120e72957b5b88c6aed26]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ${{ matrix.ref }}
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter && git log --oneline -1 && bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/phase-fail.ts ../harness-repo/harness/diag/planner-stuck.ts .
          gunzip -c ../harness-repo/harness/phase-inputs/${{ matrix.input }}.srj.json.gz > in.srj.json
          timeout 3000 bun phase-fail.ts in.srj.json ${{ matrix.input }} ${{ matrix.effort }} > q.log 2>&1 || true
          grep -E "^PHASE .*(solved=|error=|failingStage)" q.log | cut -c1-400
