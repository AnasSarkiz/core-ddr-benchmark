name: Contact repair fix, failing tests on main vs fix

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-fails.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [main, fix]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: b90d04b0f476d865aacaf99b19123e12ddef4a3f
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          if [ "${{ matrix.variant }}" = fix ]; then git apply --include=package.json ../harness-repo/harness/ar-exp/contact-fix-v3.patch; fi
          bun install > /dev/null 2>&1
          for t in tests/features/pipeline9-srj33-contact-repair-budget.test.ts tests/repro/pipeline9-a13-via-cleanup-reference.test.ts tests/repro/pipeline9-a13-regional-repair-shorts.test.ts; do
            bun test $t --timeout 9999999 > t.log 2>&1 && r=pass || r=fail
            echo "RESULT ${{ matrix.variant }} $t $r"
            grep -vE "^\s+at " t.log | grep -E "Expected|Received|toBe|toHave|toEqual|differs|^\s+[0-9]+ \|.*expect" | cut -c1-200 | head -12
          done
