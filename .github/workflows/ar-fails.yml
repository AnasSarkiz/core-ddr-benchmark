name: STM32MP157 BGA escape failure diagnosis

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-fails.trigger']

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        circuit: [stmp157]
        input: [coremain]
        ref: [dc19141b]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          path: autorouter
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          git checkout -q ${{ matrix.ref }} && git log --oneline -1
          bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/phase-fail.ts ../harness-repo/harness/diag/bga-fail.ts .
          gunzip -c ../harness-repo/harness/phase-inputs/${{ matrix.circuit }}-${{ matrix.input }}.srj.json.gz > in.srj.json
          bun bga-fail.ts in.srj.json /tmp/bga-graphics.json > p.log 2>&1 || true
          grep -E "^BGA" p.log | cut -c1-900; tail -5 p.log | cut -c1-400
      - name: Push graphics
        if: always()
        run: |
          cd harness-repo
          git config user.name harness-bot; git config user.email harness-bot@users.noreply.github.com
          B=diag/bga-${{ matrix.circuit }}
          git checkout -q --orphan $B; git rm -rq --cached .; git clean -fdq
          gzip -c /tmp/bga-graphics.json > g.json.gz && git add g.json.gz && git commit -qm graphics && git push -f origin $B
