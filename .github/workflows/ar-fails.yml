name: A13 via counts on current main

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-fails.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: a9da76b73d06403786f19374c2b66ff16c85b066
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Count
        run: |
          cd autorouter
          git apply --include='tests/fixtures/assets/a13-via-without-site/*' ../harness-repo/harness/ar-exp/via-repro-v1.patch
          bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/a13-via-count.ts .
          bun a13-via-count.ts main > c.log 2>&1 || true
          grep -E "^A13" c.log | cut -c1-250; tail -2 c.log | cut -c1-200
