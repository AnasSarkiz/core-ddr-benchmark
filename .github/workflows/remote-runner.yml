# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main

jobs:
  sites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        request: [a13-ram-byte1-request, a13-ram-byte0-request]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ env.SOLVER_REF }}
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd solver && bun install
      - name: Via site diagnostics
        run: cd solver && bun ../harness-repo/harness/diag/sites.ts ../harness-repo/harness/diag/${{ matrix.request }}.json.gz
