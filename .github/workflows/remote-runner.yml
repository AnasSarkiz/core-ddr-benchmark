# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        circuit: [h3, a64, stmp157, a13, orangecrab, h616, glider, imx6, icepi, butterstick]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 0ce5c61dbe004e8ce368cf491efd856870ba5aa4
          path: core
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: cd core && bun install --ignore-scripts && grep -n '"version"' node_modules/@tscircuit/capacity-autorouter/package.json node_modules/@tscircuit/bus-lanes-solver/package.json
      - name: Route
        run: |
          cd core
          bun run benchmark:ddr --circuit ${{ matrix.circuit }} --timeout 300 2>&1 | tail -12
      - name: Print the report
        if: always()
        run: |
          cd core
          echo "=====REPORT====="
          cat ddr-benchmark-results/report.md
          echo "=====END-REPORT====="
          cd ddr-benchmark-results/${{ matrix.circuit }}
          echo "=====TARBALL-BEGIN====="
          tar -czf - $(ls phase-*-start.srj.json | sort -V | tail -1) $(ls phase-*-error.srj.json phase-*-end.srj.json 2>/dev/null | sort -V | tail -1) progress.json assessment.json findings.json render.log | base64 -w 160
          echo "=====TARBALL-END====="
