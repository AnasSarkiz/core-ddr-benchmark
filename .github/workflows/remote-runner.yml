# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        circuit: [h3, a64, stmp157, a13, orangecrab, h616, glider, imx6, icepi, butterstick]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 701339c13c9f1cba5c71bf9801fac787a60de937
          path: core
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: cd core && bun install --ignore-scripts > /dev/null && grep -n '"version"' node_modules/@tscircuit/capacity-autorouter/package.json node_modules/@tscircuit/bus-lanes-solver/package.json
      - name: Route
        run: |
          cd core
          bun run benchmark:ddr --circuit ${{ matrix.circuit }} --timeout 300 > route.log 2>&1 || true
          tail -12 route.log
      - name: Print the report
        if: always()
        run: |
          cd core
          echo "=====REPORT====="
          cat ddr-benchmark-results/report.md
          echo "=====END-REPORT====="
          grep -iE "error|fail|No path|ran out" route.log | cut -c1-300 | head -20
          cd ddr-benchmark-results/${{ matrix.circuit }}
          echo "=====TARBALL-BEGIN====="
          tar -czf - phase-*.srj.json progress.json assessment.json findings.json render.log 2>/dev/null | base64 -w 160
          echo "=====TARBALL-END====="
