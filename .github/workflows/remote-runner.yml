# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 914daa787936f8a3a7b290de7a37ecc508479080
          path: core
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: cd core && bun install --ignore-scripts > /dev/null
      - name: Capture
        run: |
          cd core
          cp ../harness-repo/harness/core-exp/capture-h3-byte0.test.tsx tests/repros/
          bun test tests/repros/capture-h3-byte0.test.tsx --timeout 300000 2>&1 | grep -E "CAPTURED|pass|fail|rror" | head -20
          ls -la /tmp/h3-byte0-request.json.gz
          sha256sum /tmp/h3-byte0-request.json.gz
          echo "=====TARBALL-BEGIN====="
          base64 -w 160 /tmp/h3-byte0-request.json.gz
          echo "=====TARBALL-END====="
