# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ env.SOLVER_REF }}
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd solver && git rev-parse HEAD && bun install
      - name: Base and fix
        run: |
          cd solver
          cp -r ../harness-repo/harness/overlay/. .
          bun ../harness-repo/harness/diag/quality.ts base 2>&1 | grep -E "QUALITY|rror" 
          git apply ../harness-repo/harness/fix.patch
          bun ../harness-repo/harness/diag/quality.ts fix 2>&1 | grep -E "QUALITY|rror"
          echo "=====TARBALL-BEGIN====="
          tar -czf - quality-base.json quality-fix.json | base64 -w 160
          echo "=====TARBALL-END====="
