# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main

jobs:
  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        state: [repro, fix]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ env.SOLVER_REF }}
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd solver && git rev-parse HEAD && bun install
      - name: Overlay the repro
        run: cp -r harness-repo/harness/overlay/. solver/
      - name: Overlay the fix
        if: matrix.state == 'fix'
        run: |
          cp -r harness-repo/harness/fix/. solver/
          cd solver && git apply ../harness-repo/harness/fix.patch && git status --short
      - name: Format check and typecheck
        run: |
          cd solver
          bun run format:check 2>&1 | tail -15
          bun run typecheck 2>&1 | tail -15
      - name: Write snapshots
        run: |
          cd solver
          FILES="tests/a13-ram-bytes-sequence.test.ts"
          if [ "${{ matrix.state }}" = fix ]; then FILES="$FILES tests/a13-ram-byte0.test.ts tests/a13-preloaded-byte1.test.ts"; fi
          echo "$FILES" > files.txt
          BUN_UPDATE_SNAPSHOTS=1 bun test $FILES --timeout 900000 2>&1 | grep -E "^\((pass|fail)\)|Writing|pass$|fail$|error|Expected|Received" | head -40
          git status --short
          sha256sum tests/__snapshots__/a13-ram-bytes-sequence* tests/__snapshots__/a13-ram-byte0* tests/__snapshots__/a13-preloaded-byte1*
      - name: Emit the snapshots
        if: always()
        run: |
          cd solver
          echo "=====TARBALL-BEGIN====="
          tar -czf - $(git status --short | awk '{print $2}' | grep -E "__snapshots__.*\.svg$") | base64 -w 160
          echo "=====TARBALL-END====="
      - name: Run again against the written snapshots
        run: |
          cd solver
          bun test $(cat files.txt) --timeout 900000 2>&1 | grep -E "^\((pass|fail)\)|pass$|fail$|error|Expected|Received" | head -40
          sha256sum tests/__snapshots__/a13-ram-bytes-sequence* tests/__snapshots__/a13-ram-byte0* tests/__snapshots__/a13-preloaded-byte1*
          ls tests/__snapshots__ | grep diff || true

  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ env.SOLVER_REF }}
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd solver && git rev-parse HEAD && bun install && nproc && grep -m1 "model name" /proc/cpuinfo
      - name: Same-machine timing, base and fix alternating
        run: |
          cd solver
          FILES="tests/am3352-sequential-native-ddr.test.ts tests/imx6-preloaded-byte1.test.ts tests/repros/orangecrab-core-data-bytes.test.ts tests/a64-preloaded-byte.test.ts tests/h3-preloaded-byte.test.ts tests/native-ddr-groups-complete.test.ts"
          for round in 1 2; do
            for variant in base fix; do
              git checkout -q lib
              if [ $variant = fix ]; then git apply ../harness-repo/harness/fix.patch; fi
              echo "=====AB $variant round $round====="
              bun test $FILES --timeout 900000 2>&1 | grep -E "^\((pass|fail)\)|pass$|fail$|^Ran" 
            done
          done
