# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  h3diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: main
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd solver && git rev-parse HEAD && bun install
      - name: Which lane search routes each H3 byte
        run: |
          cd solver
          python3 ../harness-repo/harness/diag/instrument.py
          for n in byte0 byte1; do
            bun ../harness-repo/harness/diag/h3diag.ts ../harness-repo/harness/diag/h3-$n-request.json.gz out-$n.json 2>&1 | grep -E "^(LANES|PHASE|RESULT)" | cut -c1-700
          done
          echo "=====TARBALL-BEGIN====="
          tar -czf - out-*.json | base64 -w 160
          echo "=====TARBALL-END====="
