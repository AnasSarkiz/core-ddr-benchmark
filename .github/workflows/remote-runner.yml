# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: dd3383cfcb5c82960952bd44e6e1dc1d95a7f84f
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - run: cd autorouter && bun install > /dev/null 2>&1
      - name: Origin
        run: |
          cd autorouter
          cp ../harness-repo/harness/diag/pair-track.ts .
          NETS=source_net_20,source_net_8 POINT='{"x":7.91,"y":-2.55}' bun pair-track.ts ../harness-repo/harness/diag/a13-remaining-v60.json.gz > origin.log 2>&1 || true
      - name: Emit
        if: always()
        run: cd autorouter && grep -E "^(PAIR|STAGES)|rror" origin.log | cut -c1-700
