# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        circuit: [h3, a64, stmp157, a13]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: aeb7e465abc1680051e06f1c84ddc1e9166be07d
          path: core
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: cd core && bun install --ignore-scripts
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: main
          path: solver-src
          persist-credentials: false
      - name: Build bus-lanes-solver main and place it in Core
        run: |
          cd solver-src
          git rev-parse HEAD
          bun install
          bun run build
          cp dist/index.js ../core/node_modules/@tscircuit/bus-lanes-solver/dist/index.js
      - name: Route
        run: |
          cd core
          bun run benchmark:ddr --circuit ${{ matrix.circuit }} --timeout 600 2>&1 | tail -15
      - name: Print the report and the last phase
        if: always()
        run: |
          cd core
          cat ddr-benchmark-results/report.md | sed -n '/Per-circuit/,/Dependency/p'
          find ddr-benchmark-results -type f | xargs ls -la
          cd ddr-benchmark-results/${{ matrix.circuit }}
          last=$(ls phase-*-start.srj.json | sort -V | tail -1)
          echo "=====TARBALL-BEGIN====="
          tar -czf - $last $(ls ${last/-start/-error} ${last/-start/-end} 2>/dev/null) progress.json assessment.json findings.json render.log circuit.json 2>/dev/null | base64 -w 160
          echo "=====TARBALL-END====="
