# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  pendingsites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: main
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd solver && git rev-parse HEAD && bun install
      - name: Via sites left for pending pads
        run: |
          cd solver
          for n in after-byte0 after-byte1 exp-after-byte1; do
            bun ../harness-repo/harness/diag/pending-sites.ts ../harness-repo/harness/diag/h3-$n.json.gz 2>&1 | grep -E "^(==|SITES|TIME)|rror" | cut -c1-300
          done
