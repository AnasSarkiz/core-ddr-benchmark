# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_ID: '43756022392'

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the published AM3352 comparison of a public run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          api=https://api.github.com/repos/tscircuit/bus-lanes-solver
          curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/actions/runs/$BENCHMARK_RUN_ID/artifacts?per_page=50" > artifacts.json
          jq -r '.artifacts[] | "\(.id) \(.name)"' artifacts.json
          mkdir -p reports
          jq -r '.artifacts[] | "\(.id) \(.name)"' artifacts.json | while read id name; do
            code=$(curl -sS -L -o "$name.zip" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "$api/actions/artifacts/$id/zip")
            echo "$name -> HTTP $code $(stat -c %s "$name.zip")"
            mkdir -p "reports/$name" && unzip -q -o "$name.zip" -d "reports/$name" || true
          done
          set +x
          find reports -type f | head -80
          echo "=====COMPARISON====="
          cat reports/am3352-comparison/comparison.md || true
          echo "=====END-COMPARISON====="
          echo "=====TARBALL-BEGIN====="
          tar -czf - reports | base64 -w 160
          echo "=====TARBALL-END====="
