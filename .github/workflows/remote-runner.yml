# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  h3repro:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: main
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd solver && git rev-parse HEAD && bun install
      - name: Overlay, format, typecheck
        run: |
          cd solver
          cp -r ../harness-repo/harness/overlay/. .
          bunx biome format --write tests/h3-pending-pad-escapes.test.ts tests/fixtures/pad-escapes.ts
          bun run typecheck 2>&1 | tail -20
      - name: Test and write snapshots
        run: |
          cd solver
          BUN_UPDATE_SNAPSHOTS=1 bun test tests/h3-pending-pad-escapes.test.ts --timeout 900000 2>&1 | grep -E "^\((pass|fail)\)|H3 TRAPPED|Writing|pass$|fail$|rror|Expected|Received" | cut -c1-6000 | head -40
      - name: Emit
        if: always()
        run: |
          cd solver
          echo "=====TARBALL-BEGIN====="
          tar -czf - tests/h3-pending-pad-escapes.test.ts tests/fixtures/pad-escapes.ts $(ls tests/__snapshots__/h3-pending-pad-escapes* 2>/dev/null) | base64 -w 160
          echo "=====TARBALL-END====="
