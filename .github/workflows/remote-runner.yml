# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main

jobs:
  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        state: [fix]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ env.SOLVER_REF }}
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd solver && git rev-parse HEAD && bun install
      - name: Overlay the repro
        run: cp -r harness-repo/harness/overlay/. solver/
      - name: Overlay the fix
        if: matrix.state == 'fix'
        run: |
          cp -r harness-repo/harness/fix/. solver/
          cd solver && git apply ../harness-repo/harness/fix.patch && git status --short
      - name: Format check and typecheck
        run: |
          cd solver
          bun run format:check 2>&1 | tail -15
          bun run typecheck 2>&1 | tail -15
      - name: Write snapshots
        run: |
          cd solver
          FILES="tests/a13-ram-bytes-sequence.test.ts"
          if [ "${{ matrix.state }}" = fix ]; then FILES="$FILES tests/a13-ram-byte0.test.ts tests/a13-preloaded-byte1.test.ts tests/package-pad-frame.test.ts"; fi
          echo "$FILES" > files.txt
          BUN_UPDATE_SNAPSHOTS=1 bun test $FILES --timeout 900000 2>&1 | grep -E "^\((pass|fail)\)|Writing|pass$|fail$|error|Expected|Received" | head -40
          git status --short
          sha256sum tests/__snapshots__/a13-ram-bytes-sequence* tests/__snapshots__/a13-ram-byte0* tests/__snapshots__/a13-preloaded-byte1*
      - name: Emit the snapshots
        if: always()
        run: |
          cd solver
          echo "=====TARBALL-BEGIN====="
          tar -czf - $(git status --short | awk '{print $2}' | grep -E "__snapshots__.*\.svg$") | base64 -w 160
          echo "=====TARBALL-END====="
      - name: Run again against the written snapshots
        run: |
          cd solver
          bun test $(cat files.txt) --timeout 900000 2>&1 | grep -E "^\((pass|fail)\)|pass$|fail$|error|Expected|Received" | head -40
          sha256sum tests/__snapshots__/a13-ram-bytes-sequence* tests/__snapshots__/a13-ram-byte0* tests/__snapshots__/a13-preloaded-byte1*
          ls tests/__snapshots__ | grep diff || true

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ env.SOLVER_REF }}
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd solver && git rev-parse HEAD && bun install
      - name: Base and fix
        run: |
          cd solver
          cp -r ../harness-repo/harness/overlay/. .
          bun ../harness-repo/harness/diag/quality.ts base 2>&1 | grep -E "QUALITY|rror" 
          git apply ../harness-repo/harness/fix.patch
          bun ../harness-repo/harness/diag/quality.ts fix 2>&1 | grep -E "QUALITY|rror"
          echo "=====TARBALL-BEGIN====="
          tar -czf - quality-base.json quality-fix.json | base64 -w 160
          echo "=====TARBALL-END====="

  ddr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        circuit: [h3, a64, stmp157, orangecrab, a13, h616, butterstick, glider, imx6, icepi]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: aeb7e465abc1680051e06f1c84ddc1e9166be07d
          path: core
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: cd core && bun install --ignore-scripts
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ env.SOLVER_REF }}
          path: solver-src
          persist-credentials: false
      - name: Build the fixed solver and place it in Core
        run: |
          cd solver-src
          git apply ../harness-repo/harness/fix.patch && git status --short
          bun install
          bun run build
          cp dist/index.js ../core/node_modules/@tscircuit/bus-lanes-solver/dist/index.js
      - name: Route
        run: |
          cd core
          bun run benchmark:ddr --circuit ${{ matrix.circuit }} --timeout 300 2>&1 | tail -15
      - name: Print the report
        if: always()
        run: |
          cd core
          echo "=====REPORT====="
          cat ddr-benchmark-results/report.md
          echo "=====END-REPORT====="
          echo "=====TARBALL-BEGIN====="
          tar -C ddr-benchmark-results -czf - $(cd ddr-benchmark-results && ls */assessment.json */findings.json */progress.json 2>/dev/null) | base64 -w 160
          echo "=====TARBALL-END====="
