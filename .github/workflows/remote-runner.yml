# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: main
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - run: cd autorouter && git rev-parse HEAD && bun install > /dev/null 2>&1
      - name: Repro state snapshots
        run: |
          cd autorouter
          cp -r ../harness-repo/harness/overlay/. .
          bunx tsc --noEmit > tsc.log 2>&1 || true
          F=tests/repro/pipeline9-a13-declared-trace-clearance.test.ts
          BUN_UPDATE_SNAPSHOTS=1 bun test $F --timeout 600000 > r1.log 2>&1 || true
          sha256sum tests/repro/__snapshots__/pipeline9-a13-declared-trace-clearance*.svg > sha1.txt || true
          bun test $F --timeout 600000 > r2.log 2>&1 || true
      - name: Emit
        if: always()
        run: |
          cd autorouter
          echo "=====TSC====="; tail -15 tsc.log
          echo "=====R1====="; grep -vE "^\s*$" r1.log | tail -25 | cut -c1-240
          echo "=====R2====="; grep -vE "^\s*$" r2.log | tail -25 | cut -c1-240
          cat sha1.txt; git status --short
          grep -o "Relaxed DRC errors: [0-9]*\|Trace pairs under [0-9. m]*: [0-9]*" tests/repro/__snapshots__/pipeline9-a13-declared-trace-clearance*.svg
          echo "=====TARBALL-BEGIN====="
          tar -czf - tests/repro/__snapshots__/pipeline9-a13-declared-trace-clearance*.svg | base64 -w 160
          echo "=====TARBALL-END====="
  fixfail:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: main
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - run: cd autorouter && git rev-parse HEAD && bun install > /dev/null 2>&1
      - name: Failing files with the change, no snapshot update
        run: |
          cd autorouter
          python3 ../harness-repo/harness/ar-exp/board-clearance.py
          for F in tests/repro/pipeline9-glider-dqs-fixed-copper.test.ts tests/repro/pipeline9-h3-ddr-strobe-via-access.test.ts tests/repro/pipeline9-ecp5-declared-clearance.test.ts tests/repro/pipeline9-t113-hdmi-ddc-via-spacing.test.ts tests/repro/pipeline9-muse-eink-via-copper-clearance.test.ts tests/repro/pipeline9-ecp5-fixed-copper-clearance.test.ts tests/repro/pipeline9-imx6-ddr-fixed-copper.test.ts tests/repro/pipeline9-orangecrab-through-vias.test.ts tests/bugs/controller-power-expansion.test.tsx tests/repro/pipeline9-orangecrab-through-via-layer-span.test.ts tests/repro/pipeline9-a13-fixed-copper-checks.test.ts tests/repro/pipeline9-ddr-force-clearance.test.ts; do
            echo "########## $F" >> ff.log
            bun test $F --timeout 600000 >> ff.log 2>&1 || true
          done
      - name: Emit
        if: always()
        run: |
          cd autorouter
          grep -vE "^\s*$" ff.log | grep -vE "^\s+at |^✓|Writing|Updating" | cut -c1-260 | head -400
