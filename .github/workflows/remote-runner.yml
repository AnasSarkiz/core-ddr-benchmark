# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  arrun:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        circuit: [a64, stmp157, a13, h3]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: main
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd autorouter && git rev-parse HEAD && bun install
      - name: Route the remaining-phase request
        run: |
          cd autorouter
          cp ../harness-repo/harness/diag/ar-run.ts scripts/ar-run.ts
          bun scripts/ar-run.ts ../harness-repo/harness/diag/${{ matrix.circuit }}-remaining.json.gz out.json 900 > out.txt 2>&1 || true
      - name: Print
        if: always()
        run: |
          cd autorouter
          grep -E "^(STAGE|RESULT|CHAIN|TIMES|THREW)" out.txt | cut -c1-1500 | tail -70
          grep -v "^STAGE\|^RESULT\|^CHAIN\|^TIMES" out.txt | sort | uniq -c | sort -rn | head -15 | cut -c1-300
