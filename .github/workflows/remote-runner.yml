# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main

jobs:
  sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        state: [repro, fix]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ env.SOLVER_REF }}
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd solver && git rev-parse HEAD && bun install
      - name: Overlay the repro
        run: cp -r harness-repo/harness/overlay/. solver/
      - name: Overlay the fix
        if: matrix.state == 'fix'
        run: |
          cp -r harness-repo/harness/fix/. solver/
          cd solver
          sed -i 's|  if (!hasCompletedTrunk) return \[\]|  // experiment: pending exits are computed for every request|' lib/pending-lane-certificates.ts
      - name: Format and typecheck
        run: |
          cd solver
          bunx biome format --write tests/a13-ram-bytes-sequence.test.ts
          bun run typecheck 2>&1 | tail -30
      - name: Run the test and write its snapshots
        run: |
          cd solver
          BUN_UPDATE_SNAPSHOTS=1 bun test tests/a13-ram-bytes-sequence.test.ts --timeout 900000 2>&1 | tail -40
      - name: Emit the formatted test and snapshots
        if: always()
        run: |
          cd solver
          echo "=====TARBALL-BEGIN====="
          tar -czf - tests/a13-ram-bytes-sequence.test.ts tests/__snapshots__/a13-ram-bytes-sequence* | base64 -w 160
          echo "=====TARBALL-END====="
