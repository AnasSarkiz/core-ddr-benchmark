# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  a64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: cbd27db2e7de5697d24fc63928c43fb92d3431d1
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Route A64 byte 2
        run: |
          cd solver
          bun install > /dev/null 2>&1
          git apply ../harness-repo/harness/bl-exp/pending-bus-plan.patch
          cp ../harness-repo/harness/bl-exp/a64-byte2.ts .
          timeout 3000 bun a64-byte2.ts ../harness-repo/harness/bl-exp/a64/main-byte2.srj.json ../harness-repo/harness/bl-exp/a64/planned-byte2.srj.json > a64.log 2>&1 || true
      - name: Emit
        if: always()
        run: cd solver && grep -E "^(PHASE|A64)|rror" a64.log | uniq | cut -c1-300 | head -80
