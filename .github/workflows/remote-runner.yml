# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  snaps:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        state: [repro, fix]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: cbd27db2e7de5697d24fc63928c43fb92d3431d1
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Overlay
        run: |
          cd solver
          bun install > /dev/null 2>&1
          cp -r ../harness-repo/harness/bl-overlay/. .
          if [ "${{ matrix.state }}" = fix ]; then
            cp ../harness-repo/harness/bl-exp/plan-with-pending-buses.ts lib/
            git apply ../harness-repo/harness/bl-exp/pending-bus-plan.patch
            python3 ../harness-repo/harness/bl-exp/fix-expectation.py
          fi
          git status --short
          bun run format:check 2>&1 | tail -15
          bun run typecheck 2>&1 | tail -15
      - name: Write snapshots, then run against them
        run: |
          cd solver
          F=tests/h3-byte0-later-bus-carriers.test.ts
          BUN_UPDATE_SNAPSHOTS=1 bun test $F --timeout 900000 > s1.log 2>&1 || true
          grep -E "^\((pass|fail)\)|pass$|fail$|rror|Expected|Received|toEqual|^- |^\+ " s1.log | head -40
          sha256sum tests/__snapshots__/h3-byte0-later-bus-carriers*
          bun test $F --timeout 900000 > s2.log 2>&1 || true
          grep -E "^\((pass|fail)\)|pass$|fail$|rror|Expected|Received" s2.log | head -20
          sha256sum tests/__snapshots__/h3-byte0-later-bus-carriers*
      - name: Emit
        if: always()
        run: |
          cd solver
          echo "=====TARBALL-BEGIN====="
          tar -czf - tests/__snapshots__/h3-byte0-later-bus-carriers* | base64 -w 160
          echo "=====TARBALL-END====="
