# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  ar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: dd3383cfcb5c82960952bd44e6e1dc1d95a7f84f
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - run: cd autorouter && bun install > /dev/null 2>&1
      - name: Route H3 remaining
        run: |
          cd autorouter
          cp ../harness-repo/harness/diag/ar-run.ts .
          bun ar-run.ts ../harness-repo/harness/diag/h3-remaining-planned.json.gz /tmp/out.json 1500 1 > run.log 2>&1 || true
      - name: Emit
        if: always()
        run: cd autorouter && grep -E "^(STAGE|RESULT|TIMES|STATS|DRC )" run.log | cut -c1-3000 | head -60
