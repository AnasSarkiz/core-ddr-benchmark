# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main

jobs:
  ddr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        circuit: [h3, a64, stmp157, orangecrab, a13, h616, butterstick, glider, imx6, icepi]
        variant: [base, fix]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: aeb7e465abc1680051e06f1c84ddc1e9166be07d
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --ignore-scripts
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ env.SOLVER_REF }}
          path: solver-src
          persist-credentials: false
      - name: Build the solver under test and place it in Core
        run: |
          cd solver-src
          git rev-parse HEAD
          if [ "${{ matrix.variant }}" = fix ]; then
            sed -i 's|  if (!hasCompletedTrunk) return \[\]|  // experiment: pending exits are computed for every request|' lib/pending-lane-certificates.ts
            git diff --stat
          fi
          bun install
          bun run build
          cd ..
          ls -la node_modules/@tscircuit/bus-lanes-solver/dist | head
          grep -c "hasCompletedTrunk) return" node_modules/@tscircuit/bus-lanes-solver/dist/index.js || true
          cp solver-src/dist/index.js node_modules/@tscircuit/bus-lanes-solver/dist/index.js
          echo "after replacement:"; grep -c "hasCompletedTrunk) return" node_modules/@tscircuit/bus-lanes-solver/dist/index.js || true
          rm -rf solver-src
      - name: Route
        run: |
          bun run benchmark:ddr --circuit ${{ matrix.circuit }} --timeout 300 2>&1 | tail -15
      - name: Print the report
        if: always()
        run: |
          echo "=====REPORT====="
          cat ddr-benchmark-results/report.md
          echo "=====END-REPORT====="
