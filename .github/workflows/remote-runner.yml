# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: main
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - run: cd autorouter && git rev-parse HEAD && bun install > /dev/null 2>&1
      - name: Track
        run: |
          cd autorouter
          cp ../harness-repo/harness/diag/hd-via.ts .
          WATCH='{"x":4.65,"y":5.864,"w":0.5,"h":0.32}' bun hd-via.ts ../harness-repo/harness/diag/a13-remaining-v60.json.gz > track.log 2>&1 || true
      - name: Emit
        if: always()
        run: cd autorouter && grep -E "^(HDVIA|NODE|  PORT)|rror" track.log | cut -c1-600 | head -80
