# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        request: [a13-reserve-ram-byte1, a13-reserve-ram-byte0]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: repro/h3-pending-pad-escapes
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd solver && git rev-parse HEAD && bun install
      - name: Reserve an escape for each trapped pad and reroute
        run: |
          cd solver
          bun ../harness-repo/harness/diag/reserve.ts ../harness-repo/harness/diag/${{ matrix.request }}.json.gz result.json > out.txt 2>&1 || true
      - name: Print
        if: always()
        run: |
          cd solver
          grep -E "^RESERVE|rror" out.txt | cut -c1-1300 | tail -40
