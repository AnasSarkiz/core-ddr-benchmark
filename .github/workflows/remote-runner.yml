# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  h3:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [current, joint, swap]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: main
          path: solver
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install and bring in the #203 fixtures
        run: |
          cd solver
          git rev-parse HEAD
          git fetch -q origin repro/h3-pending-pad-escapes
          git checkout FETCH_HEAD -- tests/fixtures/h3-pending-pad-escapes tests/fixtures/pad-escapes.ts
          bun install > /dev/null 2>&1
      - name: Route byte 1
        run: |
          cd solver
          cp ../harness-repo/harness/bl-exp/h3-order.ts .
          timeout 2400 bun h3-order.ts ${{ matrix.variant }} > h3.log 2>&1 || true
      - name: Emit
        if: always()
        run: cd solver && grep -E "^(STEP|ORDER)|rror" h3.log | cut -c1-400 | head -40
