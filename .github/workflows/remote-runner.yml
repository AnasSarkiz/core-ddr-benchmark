# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  subset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [base, board-clearance]
        subset:
          - { name: pairs12, keep: '95,17,86,79,56,44,54,42,49,39,11,8', drop: '' }
          - { name: address6, keep: '54,42,49,39,11,8', drop: '' }
          - { name: nodm, keep: '', drop: '76,77' }
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: main
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd autorouter && git rev-parse HEAD && bun install
      - name: Route a subset of the A13 remaining-phase request
        env:
          KEEP: ${{ matrix.subset.keep }}
          DROP: ${{ matrix.subset.drop }}
        run: |
          cd autorouter
          cp ../harness-repo/harness/diag/ar-run.ts scripts/ar-run.ts
          if [ "${{ matrix.variant }}" != base ]; then python3 ../harness-repo/harness/ar-exp/${{ matrix.variant }}.py && git diff --stat; fi
          bun scripts/ar-run.ts ../harness-repo/harness/diag/a13-remaining.json.gz out.json 900 1 > out.txt 2>&1 || true
      - name: Print
        if: always()
        run: |
          cd autorouter
          grep -E "^(CONNECTIONS|RESULT|THREW|DRC )" out.txt | cut -c1-400
          grep -E "^DRCERR board" out.txt | sed -E 's/unnamed //g' | cut -c1-150 | sort | uniq -c
          grep -E "^STATS pipeline9JointDrcRepairSolver" out.txt | grep -o '"initialBoundedRegionalRepair[A-Za-z]*":[^,]*' | tr '\n' ' '
