# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 960282419809a03bc6c2d4da52bb3056068e6476
          path: core
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: cd core && bun install --ignore-scripts > /dev/null
      - name: Route
        run: cd core && bun run benchmark:ddr --circuit butterstick --timeout 600 > route.log 2>&1 || true; tail -3 core/route.log || true
      - name: Keep the remaining request
        run: |
          cd core/ddr-benchmark-results/butterstick
          ls
          f=$(ls phase-*-start.srj.json | sort -V | tail -1); echo $f
          gzip -c $f > /tmp/butterstick-remaining.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: butterstick-remaining
          path: /tmp/butterstick-remaining.json.gz
  ar:
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [base, split-nodes]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 8da00b27530a97bc6e1d76b2bedd96e8c9087ad5
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - run: cd autorouter && bun install > /dev/null 2>&1
      - uses: actions/download-artifact@v4
        with:
          name: butterstick-remaining
          path: req
      - name: Route
        run: |
          cd autorouter
          if [ "${{ matrix.variant }}" != base ]; then git apply ../harness-repo/harness/ar-exp/${{ matrix.variant }}.patch; fi
          cp ../harness-repo/harness/diag/ar-run.ts .
          bun ar-run.ts ../req/butterstick-remaining.json.gz /tmp/out.json 1200 1 > run.log 2>&1 || true
      - name: Emit
        if: always()
        run: |
          cd autorouter
          grep -E "^(RESULT|TIMES|DRC )" run.log | cut -c1-1500
          grep -E "^STATS pipeline9JointDrcRepairSolver" run.log | cut -c1-600
