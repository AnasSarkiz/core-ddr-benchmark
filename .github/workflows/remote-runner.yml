# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  arddr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        circuit: [butterstick]
        variant: [base, split-nodes]
        repeat: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 960282419809a03bc6c2d4da52bb3056068e6476
          path: core
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: cd core && bun install --ignore-scripts > /dev/null
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 8da00b27530a97bc6e1d76b2bedd96e8c9087ad5
          path: autorouter
          persist-credentials: false
      - name: Build the autorouter under test and place it in Core
        run: |
          cd autorouter
          if [ "${{ matrix.variant }}" != base ]; then git apply ../harness-repo/harness/ar-exp/${{ matrix.variant }}.patch; fi
          bun install > /dev/null 2>&1
          bun run build 2>&1 | tail -2
          rm -rf ../core/node_modules/@tscircuit/capacity-autorouter/dist
          cp -r dist ../core/node_modules/@tscircuit/capacity-autorouter/dist
      - name: Route
        run: |
          cd core
          bun run benchmark:ddr --circuit ${{ matrix.circuit }} --timeout 300 > route.log 2>&1 || true
          tail -12 route.log
      - name: Print the report
        if: always()
        run: |
          cd core
          echo "=====REPORT====="
          cat ddr-benchmark-results/report.md
          echo "=====END-REPORT====="
          cd ddr-benchmark-results/${{ matrix.circuit }}
          echo "=====TARBALL-BEGIN====="
          tar -czf - progress.json assessment.json findings.json | base64 -w 160
          echo "=====TARBALL-END====="
