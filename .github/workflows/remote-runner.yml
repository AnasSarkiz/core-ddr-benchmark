# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ env.SOLVER_REF }}
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd solver && git rev-parse HEAD && bun install && nproc && grep -m1 "model name" /proc/cpuinfo
      - name: Same-machine timing, base and fix alternating
        run: |
          cd solver
          FILES="tests/am3352-sequential-native-ddr.test.ts tests/imx6-preloaded-byte1.test.ts tests/repros/orangecrab-core-data-bytes.test.ts tests/a64-preloaded-byte.test.ts tests/h3-preloaded-byte.test.ts tests/native-ddr-groups-complete.test.ts"
          for round in 1 2; do
            for variant in base fix; do
              git checkout -q lib
              if [ $variant = fix ]; then git apply ../harness-repo/harness/fix.patch; fi
              echo "=====AB $variant round $round====="
              bun test $FILES --timeout 900000 2>&1 | grep -E "^\((pass|fail)\)|pass$|fail$|^Ran" 
            done
          done
