# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        experiment: [none, ungate-pending-exits]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ env.SOLVER_REF }}
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd solver && git rev-parse HEAD && bun install
      - name: Apply the experiment
        if: matrix.experiment == 'ungate-pending-exits'
        run: |
          cd solver
          sed -i 's|  if (!hasCompletedTrunk) return \[\]|  // experiment: pending exits are computed for every request|' lib/pending-lane-certificates.ts
          git diff | grep "^[+-] " || true
      - name: Full test suite
        run: |
          cd solver
          set +e
          bun test --timeout 120000 > suite.log 2>&1
          echo "exit code $?"
          grep -E "^\(fail\)|^\(pass\)" suite.log | sed -E 's/\[[0-9.]+ms\]//' | sort > results.txt
          echo "=====SUMMARY====="; tail -8 suite.log
          echo "=====FAILED====="; grep -E "^\(fail\)" suite.log
          echo "=====SLOWEST====="; grep -E "^\((pass|fail)\)" suite.log | sed -E 's/^(.*)\[([0-9.]+)ms\]$/\2 \1/' | sort -rn | head -25
          echo "=====CHANGED-FILES====="; git status --short | head -40
