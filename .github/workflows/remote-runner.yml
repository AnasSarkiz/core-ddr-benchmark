# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  arpr:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        state: [repro, fix]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: main
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - run: cd autorouter && git rev-parse HEAD && bun install
      - name: Overlay
        run: |
          cd autorouter
          cp -r ../harness-repo/harness/overlay/. .
          if [ "${{ matrix.state }}" = fix ]; then
            python3 ../harness-repo/harness/ar-exp/board-clearance.py
            sed -i 's|  expect(closeTracePairs).toHaveLength(6)|  expect(closeTracePairs).toEqual([])|' tests/repro/pipeline9-a13-declared-trace-clearance.test.ts
            git diff --stat
          fi
          bunx biome format tests/repro/pipeline9-a13-declared-trace-clearance.test.ts lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9BoundedRegionalRepairSolver.ts 2>&1 | tail -20
          bunx tsc --noEmit 2>&1 | tail -15
      - name: Test and write snapshots, then run against them
        run: |
          cd autorouter
          FILES="tests/repro/pipeline9-a13-declared-trace-clearance.test.ts"
          if [ "${{ matrix.state }}" = fix ]; then FILES="$FILES tests/repro/pipeline9-a13-fixed-copper-checks.test.ts"; fi
          BUN_UPDATE_SNAPSHOTS=1 bun test $FILES --timeout 600000 2>&1 | grep -E "^\((pass|fail)\)|pass$|fail$|rror|Expected|Received" | head -30
          git status --short
          sha256sum tests/repro/__snapshots__/pipeline9-a13-declared-trace-clearance.snap.svg tests/repro/__snapshots__/pipeline9-a13-fixed-copper-checks.snap.svg
          bun test $FILES --timeout 600000 2>&1 | grep -E "^\((pass|fail)\)|pass$|fail$|rror|Expected|Received" | head -30
          git status --short
          grep -o "Relaxed DRC errors: [0-9]*" tests/repro/__snapshots__/pipeline9-a13-declared-trace-clearance.snap.svg tests/repro/__snapshots__/pipeline9-a13-fixed-copper-checks.snap.svg
      - name: Emit
        if: always()
        run: |
          cd autorouter
          echo "=====TARBALL-BEGIN====="
          tar -czf - $(git status --short | awk '{print $2}' | grep -E "snap\.svg$") | base64 -w 160
          echo "=====TARBALL-END====="
