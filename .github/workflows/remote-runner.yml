# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main

jobs:
  a13core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: aeb7e465abc1680051e06f1c84ddc1e9166be07d
          path: core
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: cd core && bun install --ignore-scripts
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ env.SOLVER_REF }}
          path: solver-src
          persist-credentials: false
      - name: Build the fixed solver and place it in Core
        run: |
          cd solver-src
          git apply ../harness-repo/harness/fix.patch && git diff --stat
          bun install
          bun run build
          cp dist/index.js ../core/node_modules/@tscircuit/bus-lanes-solver/dist/index.js
      - name: Route A13
        run: |
          cd core
          bun run benchmark:ddr --circuit a13 --timeout 900 2>&1 | tail -15
      - name: Print the results
        if: always()
        run: |
          cd core
          cat ddr-benchmark-results/report.md
          find ddr-benchmark-results -type f | xargs ls -la
          echo "=====TARBALL-BEGIN====="
          tar -C ddr-benchmark-results -czf - . | base64 -w 160
          echo "=====TARBALL-END====="
