# Temporary remote runner for the A13 bus-lanes investigation.
# Lives only on the ci/a13-validation branch of this fork; not part of any PR.
name: Remote runner

on:
  push:
    branches: [ci/a13-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLVER_REF: main
  BENCHMARK_RUN_IDS: '43755978071 43762402853'

jobs:
  h3sites:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: repro/h3-pending-pad-escapes
          path: solver
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: cd solver && git rev-parse HEAD && bun install
      - name: Byte 1 with expanded via sites offered beside surface approaches
        run: |
          cd solver
          bun ../harness-repo/harness/diag/h3-reserve.ts > out.txt 2>&1 || true
      - name: Print
        if: always()
        run: |
          cd solver
          grep -E "^RESERVE|rror" out.txt | cut -c1-1200 | tail -60
