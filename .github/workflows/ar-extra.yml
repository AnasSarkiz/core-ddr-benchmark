name: Raw DRC contact errors

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 8bc7eeee1d42c94eb72f32460dc03f54add143e5
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/contact-errors.ts .
          bun contact-errors.ts > c.log 2>&1 || true
          grep -E "^CASE" c.log | cut -c1-900; tail -5 c.log | cut -c1-300
