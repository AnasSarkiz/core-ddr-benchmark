name: BeaglePlay same runner, base vs guard

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ce89da32c1c31f84ad5f5a753a665ac056df66a9
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          F=$(grep -rlF "BeaglePlay DDR4 routes without clearance or port errors" tests | head -1); echo "FILE $F"
          for v in base guard base2 guard2; do
            git checkout -q -- lib
            case $v in guard*) git apply --include='lib/*' ../harness-repo/harness/ar-exp/guard-fix.patch;; esac
            start=$(date +%s); bun test "$F" --timeout 3600000 > t.log 2>&1 || true; end=$(date +%s)
            echo "BP $v seconds=$((end-start)) $(grep -E '^\((pass|fail)\)' t.log | cut -c1-80)"
            grep -vE '^\s+at ' t.log | grep -E '^error|Expected|Received|^[-+] ' | head -8 | sed "s/^/BP $v   /" | cut -c1-200
          done
