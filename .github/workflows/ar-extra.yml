name: H616 under each final-phase contact check

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  h616:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [both, no-projection-check, no-safe-layer-check]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 2004d10e16be12c9c3773e1fb7ea8384552a1b4e
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Run H616
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/fix-v6.patch
          F=lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9RegionalB01RepairSolver.ts
          if [ "${{ matrix.variant }}" = no-projection-check ]; then sed -i 's/    if (!introducesPipeline9DrcContact(errors, cleanup.errors)) {/    if (true) {/' $F; fi
          if [ "${{ matrix.variant }}" = no-safe-layer-check ]; then python3 ../harness-repo/harness/ar-exp/drop-safe-layer-check.py; fi
          git diff --stat
          bun install > /dev/null 2>&1
          BUN_UPDATE_SNAPSHOTS=1 bun test tests/repro/pipeline9-h616-full-board-ddr-clearance.test.ts --timeout 9999999 > out.log 2>&1 || true
          grep -E "error:|Expected|Received|\(pass\)|\(fail\)|^\s+[-+] " out.log | head -30
          git status --short tests
