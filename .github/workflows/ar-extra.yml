name: Diagnose new-contact rejections on srj33 sample 3

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [as-is, remap]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea0f7f8ed1f543aa8a2c79255b65ab05cf5e6241
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Run srj33 sample 3 and A13
        run: |
          cd autorouter
          if [ "${{ matrix.variant }}" = remap ]; then git apply ../harness-repo/harness/ar-exp/contact-remap.patch; fi
          python3 ../harness-repo/harness/ar-exp/instr-contacts.py
          git diff --stat
          bun install > /dev/null 2>&1
          bun test tests/features/pipeline9-srj33-sample3-contact-regional-repair.test.ts --timeout 9999999 2>&1 | grep -E "NEWCONTACT|Expected|Received|\(pass\)|\(fail\)" | head -40
          bun test tests/repro/pipeline9-a13-refine-pad-contacts.test.ts --timeout 9999999 2>&1 | grep -E "NEWCONTACT|\(pass\)|\(fail\)" | head -12
