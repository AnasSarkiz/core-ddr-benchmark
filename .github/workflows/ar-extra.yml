name: H616 fixture DRC on main 9c99c6b vs #3971

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [main, fix]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 9c99c6bff7acce2aa7193de7aac64132471df724
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Check
        run: |
          cd autorouter
          if [ "${{ matrix.variant }}" = fix ]; then git apply ../harness-repo/harness/ar-exp/fix-v10.patch; fi
          python3 ../harness-repo/harness/ar-exp/h616-print.py
          bun install > /dev/null 2>&1
          BUN_UPDATE_SNAPSHOTS=1 bun test tests/repro/pipeline9-h616-full-board-ddr-clearance.test.ts --timeout 9999999 > out.log 2>&1 || true
          grep -E "H616DIAG|\(pass\)|\(fail\)" out.log | head
