name: Check the A13 contact repair fix

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: b90d04b0f476d865aacaf99b19123e12ddef4a3f
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Check
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/contact-fix-v2.patch
          bun install > /dev/null 2>&1
          bunx tsc --noEmit > tsc.log 2>&1 && echo "TSC exit=0" || { echo "TSC failed"; head -30 tsc.log; }
          bunx biome format . > fmt.log 2>&1 && echo "FMT exit=0" || { echo "FMT failed"; grep -B2 -A30 "Formatter would" fmt.log | head -80; }
          T=tests/repro/pipeline9-a13-contact-repair-via-clearance.test.ts
          BUN_UPDATE_SNAPSHOTS=1 bun test $T --timeout 9999999 > u.log 2>&1 && echo "UPDATE pass" || { echo "UPDATE fail"; grep -vE "^\s+at " u.log | grep -E "error|Expected|Received|^\s+[-+] |\"" | head -30; }
          start=$(date +%s); bun test $T --timeout 9999999 > t.log 2>&1 && echo "SECOND pass $(($(date +%s)-start))s" || { echo "SECOND fail"; grep -E "differs|error" t.log | head; }
          mkdir -p ../out; tar -czf ../out/snaps.tgz tests/repro/__snapshots__/pipeline9-a13-contact-repair-via-clearance*.snap.svg
      - name: Push the snapshots to a branch
        run: |
          cd harness-repo
          git config user.name harness-bot; git config user.email harness-bot@users.noreply.github.com
          git checkout -q --orphan snaps/contact-fix; git rm -rq --cached .; git clean -fdq
          cp ../out/snaps.tgz .; git add snaps.tgz; git commit -qm "contact fix snapshots"; git push -f origin snaps/contact-fix
