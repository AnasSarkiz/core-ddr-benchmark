name: New main, joint repair sub-solver pad gaps

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [fix, rulefix]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ce89da32c1c31f84ad5f5a753a665ac056df66a9
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/repro-tests.patch 2>/dev/null
          v=${{ matrix.variant }}
          case $v in *fix) git apply ../harness-repo/harness/ar-exp/fix-code.patch;; esac
          case $v in rule*) git apply ../harness-repo/harness/ar-exp/no-short-trade.patch && echo "RULE applied $(grep -c isPipeline9CopperContact lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/pipeline9JointDrcRepairUtils.ts)";; esac
          bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/pad-track.ts .
          POINTS='[[-5.42,3.46],[-6.21,3.48],[-6.29,2.79],[-6.57,1.86]]' bun pad-track.ts tests/fixtures/assets/a13-fixed-copper/remaining64-bus060.srj.json.gz $v > p.log 2>&1 || true; grep -E "^PAD $v (EVAL|final)" p.log | cut -c1-300; tail -3 p.log | cut -c1-200
