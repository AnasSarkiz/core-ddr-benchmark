name: Check the via-site fix v4

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 2436c416110fb917a90219ea312086bfa14807a6
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Check
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/via-fix-v4.patch
          bun install > /dev/null 2>&1
          bunx tsc --noEmit > tsc.log 2>&1 && echo "TSC exit=0" || { echo "TSC failed"; head -30 tsc.log; }
          bunx biome format . > fmt.log 2>&1 && echo "FMT exit=0" || { echo "FMT failed"; grep -B2 -A25 "Formatter would" fmt.log | head -80; }
          cp ../harness-repo/harness/diag/a13-via-count.ts ../harness-repo/harness/diag/a13-via-trace.ts .
          bun a13-via-count.ts fix > c.log 2>&1 || true; grep -E "^A13" c.log | cut -c1-250; tail -2 c.log | cut -c1-250
          bun a13-via-trace.ts > t.log 2>&1 || true; grep -E "^(TRACE|NODE)" t.log | grep -vE "nearTargets=0|^DEBUG" | grep -E "NODE|stage=(highDensityRouteSolver|pipeline9JointDrcRepairSolver|final)|^TRACE   via" | cut -c1-300 | head -40
