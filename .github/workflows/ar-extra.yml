name: Prove the A13 test catches new contacts

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [no-rule]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea0f7f8ed1f543aa8a2c79255b65ab05cf5e6241
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Run srj33 sample 3 and A13
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/fix-v4.patch
          sed -i 's/rejectNewContacts: true,/rejectNewContacts: false,/' lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9RegionalB01RepairSolver.ts
          git diff --stat
          bun install > /dev/null 2>&1
          bun test tests/repro/pipeline9-a13-refine-pad-contacts.test.ts --timeout 9999999 2>&1 | grep -E "touches|\(pass\)|\(fail\)" | head -12
