name: Capture native A13 joint repair input with the fix

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [fix]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ce89da32c1c31f84ad5f5a753a665ac056df66a9
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/repro-tests.patch 2>/dev/null
          v=${{ matrix.variant }}
          case $v in *fix) git apply ../harness-repo/harness/ar-exp/fix-code.patch;; esac
          case $v in guard*) git apply ../harness-repo/harness/ar-exp/refine-no-new-contact.patch && echo "GUARD applied";; esac
          bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/capture-joint.ts .
          bun capture-joint.ts tests/fixtures/assets/a13-fixed-copper/remaining64-bus060.srj.json.gz /tmp/joint.json.gz > j.log 2>&1 || true; grep -E "^CAPTURED|rror" j.log | head -5
          ls -la /tmp/joint.json.gz; sha256sum /tmp/joint.json.gz
          echo "=====OUT-BEGIN====="; base64 -w 160 /tmp/joint.json.gz; echo "=====OUT-END====="
