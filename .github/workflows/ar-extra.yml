name: Check typed contacts before pushing

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 7b4bce6e1d807713af10cb707043eb04ef477eb1
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Check
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/fix-v5.patch
          git status --short
          bun install > /dev/null 2>&1
          bunx tsc --noEmit > tsc.log 2>&1; echo "TSC exit=$?"; head -20 tsc.log
          bunx biome format . > fmt.log 2>&1; echo "FMT exit=$?"; grep -B2 -A20 "×\|Formatter would" fmt.log | head -60
          bun test tests/features/pipeline9-drc-candidate-new-contact.test.ts tests/repro/pipeline9-a13-refine-pad-contacts.test.ts --timeout 9999999 2>&1 | grep -E "error:|touches|Expected|Received|\(pass\)|\(fail\)" | head -20
