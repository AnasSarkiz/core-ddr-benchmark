name: A13 stage profile on main, base vs fix

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 626c2a0d87572c539124cc6b13b611e6ad14e81e
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          nproc; lscpu | grep "Model name" || true
          cp ../harness-repo/harness/diag/a13-count.ts ../harness-repo/harness/diag/h616-full.ts .
          FIX=$(git rev-parse HEAD)
          BASE=0b21420fae878160e19136675584836677597303
          git fetch -q --depth 5 origin $BASE
          for v in base1 fix1 base2 fix2; do
            case $v in base*) git checkout -q $BASE -- lib; git clean -fdq lib;; fix*) git checkout -q $FIX -- lib;; esac
            bun a13-count.ts $v > a.log 2>&1 || true; grep -E "^A13 $v (solved|STAGES)" a.log | cut -c1-1500
            bun h616-full.ts $v > h.log 2>&1 || true; grep -E "^H616 $v solved" h.log | cut -c1-140
          done
