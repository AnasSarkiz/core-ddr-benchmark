name: A13 on current main, base vs fix

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: bfc6509a20959b11ebdea7e38d7fb5fe0fef2097
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          git log --oneline -1
          bun install > /dev/null 2>&1
          git apply ../harness-repo/harness/ar-exp/repro-tests.patch && echo repro-applied
          cp ../harness-repo/harness/diag/h616-full.ts ../harness-repo/harness/diag/a13-count.ts .
          bun a13-count.ts main > a.log 2>&1; grep -E "^A13" a.log | cut -c1-220; tail -2 a.log | cut -c1-200
          bun h616-full.ts main > h.log 2>&1; grep -E "^H616 .* solved" h.log | cut -c1-220
          git apply ../harness-repo/harness/ar-exp/fix-lib-final.patch && echo fix-applied
          bun a13-count.ts mainfix > a.log 2>&1; grep -E "^A13" a.log | cut -c1-220; tail -2 a.log | cut -c1-200
          bun h616-full.ts mainfix > h.log 2>&1; grep -E "^H616 .* solved" h.log | cut -c1-220
