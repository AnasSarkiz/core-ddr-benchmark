name: New main, A13 native pad overlaps by stage

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ce89da32c1c31f84ad5f5a753a665ac056df66a9
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/repro-tests.patch
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm repro
          cp ../harness-repo/harness/diag/a13-contacts.ts ../harness-repo/harness/diag/pad-track.ts /tmp/
          for v in base fix; do
            git checkout -q -- . && git clean -fdq lib tests/features
            case $v in fix) git apply ../harness-repo/harness/ar-exp/fix-code.patch;; esac
            bun install > /dev/null 2>&1
            cp /tmp/pad-track.ts .
            POINTS='[[-5.42,3.46],[-6.21,3.48],[-6.29,2.79],[-6.57,1.86],[-5.61,1.23]]' bun pad-track.ts tests/fixtures/assets/a13-fixed-copper/remaining64-bus060.srj.json.gz $v > p.log 2>&1 || true; grep -E "^PAD" p.log | cut -c1-260; tail -3 p.log | cut -c1-200
            rm -f pad-track.ts
          done
