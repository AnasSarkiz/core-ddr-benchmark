name: Refine pad-contact repro and guard

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ce89da32c1c31f84ad5f5a753a665ac056df66a9
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          git apply ../harness-repo/harness/ar-exp/guard-repro.patch
          F=tests/repro/pipeline9-a13-refine-pad-contacts.test.ts
          bunx biome format --write $F > /dev/null 2>&1
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm repro
          bunx tsc --noEmit > tsc.log 2>&1; echo "TSC exit=$? lines=$(wc -l < tsc.log)"; head -10 tsc.log
          bun test $F --timeout 900000 > r1.log 2>&1 || true; grep -E "^\((pass|fail)\)|^error|Expected|Received|^[-+] " r1.log | head -20
          bun test $F --timeout 900000 > r2.log 2>&1 || true; grep -E "^\((pass|fail)\)|^error" r2.log | head -3
          mkdir -p ../out/repro && cp $F ../out/repro/ && cp tests/repro/__snapshots__/pipeline9-a13-refine-pad-contacts*.snap.svg ../out/repro/
          git apply ../harness-repo/harness/ar-exp/refine-no-new-contact.patch
          bunx biome format --write lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9RegionalB01RepairSolver.ts > /dev/null 2>&1
          sed -i 's|  expect(newPadContactIds.length).toBeGreaterThan(0)|  expect(newPadContactIds).toEqual([])|' $F
          bunx tsc --noEmit > tsc.log 2>&1; echo "TSC-fix exit=$? lines=$(wc -l < tsc.log)"; head -10 tsc.log
          FORCE_BUN_UPDATE_SNAPSHOTS=1 BUN_UPDATE_SNAPSHOTS=1 bun test $F --timeout 900000 > f1.log 2>&1 || true; grep -E "^\((pass|fail)\)|^error|Expected|Received" f1.log | head
          bun test $F --timeout 900000 > f2.log 2>&1 || true; grep -E "^\((pass|fail)\)|^error" f2.log | head -3
          bun run format:check > fc.log 2>&1; echo "FORMAT exit=$?"
          mkdir -p ../out/fix && cp tests/repro/__snapshots__/pipeline9-a13-refine-pad-contacts*.snap.svg ../out/fix/ && git diff HEAD -- lib $F > ../out/fix/fix.patch
          cd ../out && echo "=====OUT-BEGIN=====" && tar -czf - repro fix | base64 -w 160 && echo "=====OUT-END====="
