name: Refine pad-contact repro and guard

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ce89da32c1c31f84ad5f5a753a665ac056df66a9
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          git apply ../harness-repo/harness/ar-exp/guard-repro.patch
          F=tests/repro/pipeline9-a13-refine-pad-contacts.test.ts
          bunx biome format --write $F > /dev/null 2>&1
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm repro
          python3 - <<'PY'
from pathlib import Path
p=Path("tests/repro/pipeline9-a13-refine-pad-contacts.test.ts"); t=p.read_text()
t=t.replace("  expect(getPadContacts(before.errors)).toEqual([])","  console.log(`BEFORE ${getPadContacts(before.errors).length}\n${getPadContacts(before.errors).join('\n')}`)\n  console.log(`AFTER ${getPadContacts(after.errors).length}\n${getPadContacts(after.errors).join('\n')}`)")
p.write_text(t)
PY
          bun test $F --timeout 900000 > r1.log 2>&1 || true; grep -E "^(BEFORE|AFTER)|overlaps with pcb_smtpad|^\((pass|fail)\)" r1.log | head -80 | cut -c1-200
          cd ../out && echo "=====OUT-BEGIN=====" && tar -czf - repro fix | base64 -w 160 && echo "=====OUT-END====="
