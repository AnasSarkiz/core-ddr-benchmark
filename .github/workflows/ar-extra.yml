name: Guard pair on latest main

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 8bc7eeee1d42c94eb72f32460dc03f54add143e5
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          git apply ../harness-repo/harness/ar-exp/guard-repro.patch && echo REPRO
          F=tests/repro/pipeline9-a13-refine-pad-contacts.test.ts
          bun test $F --timeout 900000 > r.log 2>&1 || true; echo "REPRO-TEST $(grep -E '^\((pass|fail)\)' r.log | cut -c1-90)"
          git apply ../harness-repo/harness/ar-exp/guard-fix.patch && echo FIX
          bun test $F --timeout 900000 > f.log 2>&1 || true; echo "FIX-TEST $(grep -E '^\((pass|fail)\)' f.log | cut -c1-90)"
          grep -vE '^\s+at ' f.log | grep -E '^error|Expected|Received' | head -5
