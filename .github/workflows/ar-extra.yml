name: A13 via detail snapshot, repro and fix

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 7d8e63c573589261bd56f567c022adfb97c70233
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          F=tests/repro/pipeline9-a13-via-without-legal-site.test.ts
          git apply ../harness-repo/harness/ar-exp/detail-test.patch
          bunx tsc --noEmit > tsc.log 2>&1; echo "TSC exit=$? lines=$(wc -l < tsc.log)"; head -10 tsc.log
          bun test $F --timeout 900000 > r1.log 2>&1 || true; grep -E "^\((pass|fail)\)|^error" r1.log
          bun test $F --timeout 900000 > r2.log 2>&1 || true; grep -E "^\((pass|fail)\)|^error" r2.log
          git status --short
          echo "=====REPRO-BEGIN====="; tar -czf - tests/repro/__snapshots__/pipeline9-a13-via-without-legal-site-via-pad-detail.snap.svg | base64 -w 160; echo "=====REPRO-END====="
          git apply ../harness-repo/harness/ar-exp/fix-lib.patch
          sed -i 's|  expect(frameFindings.length).toBeGreaterThan(0)|  expect(frameFindings).toEqual([])|' $F
          BUN_UPDATE_SNAPSHOTS=1 bun test $F --timeout 900000 > f1.log 2>&1 || true; grep -E "^\((pass|fail)\)|^error" f1.log
          bun test $F --timeout 900000 > f2.log 2>&1 || true; grep -E "^\((pass|fail)\)|^error|Expected|Received" f2.log | head
          git status --short
          echo "=====FIX-BEGIN====="; tar -czf - tests/repro/__snapshots__/pipeline9-a13-via-without-legal-site*.snap.svg | base64 -w 160; echo "=====FIX-END====="
