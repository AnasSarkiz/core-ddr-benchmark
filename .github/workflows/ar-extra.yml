name: iCEPi vias under each contact check

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [all, no-projection, no-safe-layer, no-refine]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 9c99c6bff7acce2aa7193de7aac64132471df724
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Check
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/fix-v10.patch
          python3 ../harness-repo/harness/ar-exp/icepi-variant.py ${{ matrix.variant }}
          bun install > /dev/null 2>&1
          BUN_UPDATE_SNAPSHOTS=1 bun test tests/repro/pipeline9-icepi-ddr-gap-ports.test.ts --timeout 9999999 > out.log 2>&1 || true
          grep -E "error:|\(pass\)|\(fail\)" out.log | head
          echo "VIAS $(grep -o '<circle' tests/repro/__snapshots__/pipeline9-icepi-ddr-gap-ports.snap.svg | wc -l)"
