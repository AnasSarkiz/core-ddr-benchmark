name: Bump tiny-hypergraph pin for the via-only input

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 626c2a0d87572c539124cc6b13b611e6ad14e81e
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/ar-via-area.patch
          sed -i 's|tiny-hypergraph.git#f1fe8edcfb3dfde8fd644d09d81bad18743144b3|tiny-hypergraph.git#705012a249948c62bbe2b5077f009b9e801e6d3f|' package.json
          grep -n '"tiny-hypergraph"' package.json
          bun install > install.log 2>&1; echo "INSTALL exit=$?"; tail -3 install.log
          grep -n "viaAreaFraction" node_modules/tiny-hypergraph/lib/computeRegionCost.ts | head -2
          git status --short | grep -v node_modules
          bunx tsc --noEmit > tsc.log 2>&1; echo "TSC exit=$? lines=$(wc -l < tsc.log)"
          bun run format:check > fc.log 2>&1; echo "FORMAT exit=$?"
          bun test tests/repro/pipeline9-a13-via-without-legal-site.test.ts --timeout 900000 2>&1 | grep -E "^\((pass|fail)\)"
          echo "=====PIN-BEGIN====="; git diff -- package.json bun.lock | base64 -w 160; echo "=====PIN-END====="
