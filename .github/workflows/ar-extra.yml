name: Format the final fix

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: repro/a13-via-without-legal-site
          path: autorouter
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          git checkout -q repro/a13-via-without-legal-site 2>/dev/null || true
          git log --oneline -1
          bun install > /dev/null 2>&1
          git apply ../harness-repo/harness/ar-exp/fix-final.patch
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm applied
          bun run format > /dev/null 2>&1
          bun run format:check > fc.log 2>&1; echo "FORMATCHECK exit=$?"; tail -3 fc.log
          git status --short
          bunx tsc --noEmit > tsc.log 2>&1; echo "TSC exit=$? lines=$(wc -l < tsc.log)"
          for t in tests/features/mark-nodes-without-via-site-*.test.ts; do bun test $t 2>&1 | grep -E "^\((pass|fail)\)"; done
          echo "=====FMT-BEGIN====="
          git diff | base64 -w 160
          echo "=====FMT-END====="
