name: Guard final, with and without 3906

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [guard, guardfix]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ce89da32c1c31f84ad5f5a753a665ac056df66a9
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/repro-tests.patch 2>/dev/null
          git apply --include='lib/*' ../harness-repo/harness/ar-exp/guard-fix.patch && echo GUARD
          v=${{ matrix.variant }}
          case $v in *fix) git apply ../harness-repo/harness/ar-exp/fix-code.patch && echo FIX;; esac
          bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/a13-contacts.ts ../harness-repo/harness/diag/a13-count.ts ../harness-repo/harness/diag/h616-full.ts .
          bun a13-contacts.ts $v > c.log 2>&1 || true; grep -E "^CONTACT $v relaxed" c.log | cut -c1-200
          bun a13-count.ts $v > a.log 2>&1 || true; grep -E "^A13 $v (solved|viaPadAt)" a.log | cut -c1-260
          bun h616-full.ts $v > h.log 2>&1 || true; grep -E "^H616 $v solved" h.log | cut -c1-220
