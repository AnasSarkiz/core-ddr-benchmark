name: Autorouter extra files with the declared-clearance change

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ref: [repro/a13-declared-trace-clearance, fix/a13-declared-trace-clearance]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ${{ matrix.ref }}
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - run: cd autorouter && git rev-parse HEAD && bun install > /dev/null 2>&1
      - name: Checks the PR will run
        run: |
          cd autorouter
          (bun run format:check > fmt.log 2>&1 && echo "FORMAT ok") || (echo "FORMAT failed"; tail -30 fmt.log)
          (bunx tsc --noEmit > tsc.log 2>&1 && echo "TSC ok") || (echo "TSC failed"; tail -30 tsc.log)
      - name: List
        run: |
          cd autorouter
          cp ../harness-repo/harness/diag/list-declared-errors.ts ./list-declared-errors.ts
          bun list-declared-errors.ts > list.log 2>&1 || true
      - name: Emit
        if: always()
        run: cd autorouter && grep "^LIST\|rror" list.log | cut -c1-240 | head -80
