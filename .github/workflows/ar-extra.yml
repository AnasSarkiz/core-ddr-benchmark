name: A13 determinism, same code repeated

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [a, b]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 7d8e63c573589261bd56f567c022adfb97c70233
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/a13-count.ts .
          for v in base1 base2; do bun a13-count.ts $v > a.log 2>&1; grep -E "^A13" a.log | cut -c1-200; done
          git apply ../harness-repo/harness/ar-exp/fix-lib.patch
          for v in fix1 fix2 fix3; do bun a13-count.ts $v > a.log 2>&1; grep -E "^A13" a.log | cut -c1-200; done
          bun test tests/repro/pipeline9-a13-via-without-legal-site.test.ts --timeout 900000 > t.log 2>&1; grep -E "^\((pass|fail)\)" t.log
