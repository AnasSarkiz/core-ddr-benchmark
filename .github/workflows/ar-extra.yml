name: srj33 sample 3 under each contact check on new main

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [all, no-final-selection, refine-only]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 9c99c6bff7acce2aa7193de7aac64132471df724
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Check
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/fix-v8.patch
          python3 ../harness-repo/harness/ar-exp/srj33-variant.py ${{ matrix.variant }}
          git diff --stat -- lib
          bun install > /dev/null 2>&1
          bun test tests/features/pipeline9-srj33-sample3-contact-regional-repair.test.ts --timeout 9999999 > out.log 2>&1 || true
          grep -E "error:|Expected|Received|\(pass\)|\(fail\)|^\s+[-+] " out.log | head -30
