name: Regenerate the A13 refine snapshot

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea0f7f8ed1f543aa8a2c79255b65ab05cf5e6241
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Update the A13 snapshot
        run: |
          cd autorouter
          bun install > /dev/null 2>&1
          BUN_UPDATE_SNAPSHOTS=1 bun test tests/repro/pipeline9-a13-refine-pad-contacts.test.ts --timeout 9999999 2>&1 | tail -25 || true
          git status --short
          echo "=====SNAP====="
          base64 -w0 tests/repro/__snapshots__/pipeline9-a13-refine-pad-contacts-joint-output.snap.svg
          echo
          echo "=====END====="
