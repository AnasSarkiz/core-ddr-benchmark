name: Check cleanup-only rule with id validation before pushing

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [fix]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 9c99c6bff7acce2aa7193de7aac64132471df724
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Check
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/fix-v10.patch
          bun install > /dev/null 2>&1
          bunx tsc --noEmit > tsc.log 2>&1; echo "TSC exit=$?"; head -20 tsc.log
          bunx biome format . > fmt.log 2>&1; echo "FMT exit=$?"; grep -B2 -A20 "Formatter would" fmt.log | head -60
          bun test tests/features/pipeline9-drc-candidate-new-contact.test.ts tests/repro/pipeline9-a13-refine-pad-contacts.test.ts tests/features/pipeline9-srj33-sample3-contact-regional-repair.test.ts --timeout 9999999 > out.log 2>&1 || true
          BUN_UPDATE_SNAPSHOTS=1 bun test tests/repro/pipeline9-h616-full-board-ddr-clearance.test.ts --timeout 9999999 >> out.log 2>&1 || true
          grep -E "error:|Expected:|Received:|\(pass\)|\(fail\)" out.log | head -30
          git status --short tests
          echo "=====SNAP====="
          base64 -w0 tests/repro/__snapshots__/pipeline9-h616-full-board-ddr-clearance.snap.svg
          echo
          echo "=====END====="
