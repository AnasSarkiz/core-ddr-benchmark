name: Prove the A13 test catches new contacts (typed ids)

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-extra.trigger']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: 7b4bce6e1d807713af10cb707043eb04ef477eb1
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Check
        run: |
          cd autorouter
          git apply ../harness-repo/harness/ar-exp/fix-v5.patch
          git status --short
          bun install > /dev/null 2>&1
          sed -i 's/rejectNewContacts: true,/rejectNewContacts: false,/' lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9RegionalB01RepairSolver.ts
          git diff --stat
          BUN_UPDATE_SNAPSHOTS=1 bun test tests/repro/pipeline9-a13-refine-pad-contacts.test.ts --timeout 9999999 2>&1 | grep -E "error:|touches|Expected|Received|\(pass\)|\(fail\)" | head -20
