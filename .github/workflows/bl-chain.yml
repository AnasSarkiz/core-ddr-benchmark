name: ButterStick matching phases end to end

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/bl-chain.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [asis]
        patch: [none, field-free-tuning]
        ref: [main, refs/pull/4168/head]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: main
          path: bl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ${{ matrix.ref }}
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Bus phases
        run: |
          cd bl && git log --oneline -1 && bun install > /dev/null 2>&1
          [ "${{ matrix.patch }}" = none ] || git apply ../harness-repo/harness/bl-exp/${{ matrix.patch }}.patch
          cp ../harness-repo/harness/bl-exp/bs-chain.ts .
          D=../harness-repo/harness/bl-exp/bs; for n in 1 2 3 4 5; do gunzip -c $D/phase-$n.json.gz > p$n.json; done
          timeout 1800 bun bs-chain.ts ${{ matrix.variant }} /tmp/remaining.json p1.json p2.json p3.json p4.json p5.json 2>&1 | grep -E "^CHAIN|rror" | cut -c1-300; cp /tmp/remaining.json ../remaining.json 2>/dev/null || true
      - name: Remaining phase
        run: |
          [ -f /tmp/remaining.json ] || { echo "no remaining input"; exit 0; }
          cd autorouter && bun install > /dev/null 2>&1
          cp ../harness-repo/harness/diag/phase-fail.ts .
          timeout 1500 bun phase-fail.ts /tmp/remaining.json bs-${{ matrix.variant }} 1 > q.log 2>&1 || true
          grep -E "^PHASE .*(solved=|error=)" q.log | cut -c1-300
