name: Bus-lanes branch checks

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/bl-branch.trigger']

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        branch: [repro/imx6-branch-via-layer, fix/imx6-branch-via-layer]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ matrix.branch }}
          path: bl
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Checks
        run: |
          cd bl && bun install > /dev/null 2>&1
          echo "=====FOCUS====="; bun test tests/repros/imx6-branch-via-layer.test.ts --timeout 9999999 2>&1 | grep -vE '^\s*$' | tail -15
          echo "=====TSC====="; bunx tsc --noEmit 2>&1 | tail -5; echo "tsc=${PIPESTATUS[0]}"
          echo "=====FMT====="; bun run format:check 2>&1 | tail -3
