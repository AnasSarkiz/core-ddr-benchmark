name: Bus-lanes repro snapshot

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/bl-branch.trigger']

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: repro/imx6-branch-via-layer
          path: bl
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Snapshot
        run: |
          cd bl && bun install > /dev/null 2>&1
          cp ../harness-repo/harness/bl-exp/repro-overlay/imx6-branch-via-layer.test.ts tests/repros/
          BUN_UPDATE_SNAPSHOTS=1 bun test tests/repros/imx6-branch-via-layer.test.ts --timeout 120000 2>&1 | grep -E "^\((pass|fail)\)|error" | head
          echo "=====FMT====="; bun run format:check 2>&1 | tail -3
          echo "=====TSC====="; bunx tsc --noEmit 2>&1 | tail -3; echo "tsc=${PIPESTATUS[0]}"
      - name: Push the snapshot
        run: |
          cd harness-repo
          git config user.name harness-bot; git config user.email harness-bot@users.noreply.github.com
          git checkout -q --orphan snaps/repro-imx6-branch-via-layer; git rm -rq --cached .; git clean -fdq
          cp ../bl/tests/repros/__snapshots__/imx6-branch-via-layer.snap.svg . && git add -A && git commit -qm snap && git push -f origin HEAD
