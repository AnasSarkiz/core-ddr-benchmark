name: Pipeline 9 planner route budget

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ar-routes.trigger']

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        input: [butterstick-matching-remaining]
        scale: [1, 2, 4]
        ref: [main]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ${{ matrix.ref }}
          path: autorouter
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Run
        run: |
          cd autorouter && git log --oneline -1 && bun install > /dev/null 2>&1
          sed -i 's/MAX_ITERATIONS: Math.ceil(2_000_000 \* effortScale \* graphScale)/MAX_ITERATIONS: Math.ceil(2_000_000 * effortScale * graphScale * ${{ matrix.scale }})/' lib/solvers/PortPointPathingSolver/tinyhypergraph/TinyHypergraphPortPointPathingSolver.ts
          grep -n 'graphScale \*' lib/solvers/PortPointPathingSolver/tinyhypergraph/TinyHypergraphPortPointPathingSolver.ts
          cp ../harness-repo/harness/diag/planner-routes.ts .
          gunzip -c ../harness-repo/harness/phase-inputs/${{ matrix.input }}.srj.json.gz > in.srj.json
          timeout 4200 bun planner-routes.ts in.srj.json 1 > q.log 2>&1 || true
          grep -E "^ROUTES" q.log | cut -c1-600
          tail -5 q.log | cut -c1-400
