name: Bus-lanes matching phase diagnosis

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/bl-matching.trigger']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        circuit: [h3]
        ref: [main, refs/pull/254/head]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ matrix.ref }}
          path: bl
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Route
        run: |
          cd bl && git log --oneline -1 && bun install > /dev/null 2>&1
          cp ../harness-repo/harness/bl-exp/chain-matching.ts .
          M=../harness-repo/harness/bl-exp/matching
          gunzip -c $M/h3-phase-1.json.gz > p1.json; gunzip -c $M/h3-phase-2.json.gz > p2.json; mkdir -p out
          timeout 1500 bun chain-matching.ts out p1.json p2.json 2>&1 | grep -E "^CHAIN|rror" | cut -c1-900 || true
