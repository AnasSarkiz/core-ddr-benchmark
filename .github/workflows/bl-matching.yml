name: Bus-lanes matching phase diagnosis

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/bl-matching.trigger']

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        circuit: [h3]
        ref: [main]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: ${{ matrix.ref }}
          path: bl
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Route
        run: |
          cd bl && git log --oneline -1 && bun install > /dev/null 2>&1
          cp ../harness-repo/harness/bl-exp/chain-matching.ts ../harness-repo/harness/bl-exp/h3-variants.ts ../harness-repo/harness/bl-exp/h3-joint.ts ../harness-repo/harness/bl-exp/variants.ts .
          M=../harness-repo/harness/bl-exp/matching
          gunzip -c $M/h3-phase-1.json.gz > p1.json; gunzip -c $M/h3-phase-2.json.gz > p2.json; mkdir -p out
          gunzip -c $M/h3-addrcmd.json.gz > ac.json
          timeout 2400 bun variants.ts ac.json 2>&1 | grep -E "^VAR|rror" | cut -c1-400 || true
      - name: Push outputs
        if: always()
        run: |
          cd harness-repo
          git config user.name harness-bot; git config user.email harness-bot@users.noreply.github.com
          git checkout -q --orphan diag/h3-joint; git rm -rq --cached .; git clean -fdq
          cp ../bl/out/* . 2>/dev/null; touch empty; git add -A && git commit -qm out && git push -f origin HEAD
