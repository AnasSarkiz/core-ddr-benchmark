name: Bus-lanes address/command variants

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/bl-matching.trigger']

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        circuit: [h616]
        variant: [no-copper]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: main
          path: bl
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Route
        run: |
          cd bl && git log --oneline -1 && bun install > /dev/null 2>&1
          cp ../harness-repo/harness/bl-exp/variant.ts .
          gunzip -c ../harness-repo/harness/bl-exp/matching/${{ matrix.circuit }}-addrcmd.json.gz > in.json
          timeout 2400 bun variant.ts in.json ${{ matrix.variant }} 2>&1 | grep -E "^VAR|rror" | cut -c1-400 || echo "VAR ${{ matrix.variant }} timed-out-40min"
      - name: Push output
        run: |
          cd harness-repo
          git config user.name harness-bot; git config user.email harness-bot@users.noreply.github.com
          git checkout -q --orphan diag/${{ matrix.circuit }}-addrcmd-free; git rm -rq --cached .; git clean -fdq
          cp ../bl/out-*.json . && git add -A && git commit -qm out && git push -f origin HEAD
