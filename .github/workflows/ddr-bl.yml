name: Ten DDR boards through Core, bus-lanes main vs fix

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ddr-bl.trigger']

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        circuit: [h3, a64, stmp157, a13, orangecrab, h616, glider, imx6, icepi, butterstick]
        variant: [bl-base, bl-fix]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: main
          path: core
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Core main
        run: |
          cd core && git log --oneline -1 && grep bus-lanes-solver package.json
          bun install --ignore-scripts > /dev/null
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: 691799172d19f5fae7ad2ec5ddd85914abfbc412
          path: solver
          persist-credentials: false
      - name: Build bus-lanes under test and place it in Core
        run: |
          cd solver
          if [ "${{ matrix.variant }}" = bl-fix ]; then git apply ../harness-repo/harness/bl-exp/fix.patch; fi
          git status --short | head
          bun install > /dev/null 2>&1
          bun run build 2>&1 | tail -2
          cp dist/index.js ../core/node_modules/@tscircuit/bus-lanes-solver/dist/index.js
      - name: Route
        run: |
          cd core
          bun run benchmark:ddr --circuit ${{ matrix.circuit }} --timeout 300 > route.log 2>&1 || true
          tail -12 route.log
          grep -h "P9DIAG" ddr-benchmark-results/${{ matrix.circuit }}/render.log | cut -c1-220 | head -300
      - name: Print the report
        if: always()
        run: |
          cd core
          echo "=====REPORT====="
          cat ddr-benchmark-results/report.md
          echo "=====END-REPORT====="
          grep -iE "No path|ran out|AutorouterError" route.log | cut -c1-300 | head -5
          cd ddr-benchmark-results/${{ matrix.circuit }}
          echo "=====TARBALL-BEGIN====="
          tar -czf - progress.json assessment.json findings.json $(ls phase-*.srj.json 2>/dev/null) | base64 -w 160
          echo "=====TARBALL-END====="
