name: BGA solver review changes

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/bga-snaps.trigger']

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch: [fix/promote-net-without-path]
        overlay: [none, review]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bga-escape-routing-solver
          ref: ${{ matrix.branch }}
          path: bga
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Checks
        run: |
          cd bga
          bun install > /dev/null 2>&1
          if [ "${{ matrix.overlay }}" = review ]; then cp -r ../harness-repo/harness/bga-overlay/. . && git status --short; fi
          /usr/bin/time -v bun test tests/stm32mp157-core-handoff-net-order.test.ts --timeout 9999999 > stm.log 2>&1; grep -E "\((pass|fail)\)|Maximum resident|Elapsed" stm.log
          bun test tests/promoted-net-still-blocked.test.ts 2>&1 | grep -vE '^\s*$' | tail -20
          echo "=====FULL====="; bun test --timeout 9999999 2>&1 | tail -6
          echo "=====TSC====="; bunx tsc --noEmit 2>&1 | tail -5; echo "tsc=$?"
          echo "=====FMT====="; bun run format:check 2>&1 | head -60
