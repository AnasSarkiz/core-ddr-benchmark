name: Ten DDR boards on current Core main

on:
  push:
    branches: [ci/a13-validation]
    paths: ['harness/ddr-long.trigger']

permissions:
  contents: write

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        circuit: [h3, a64, stmp157, a13, orangecrab, h616, glider, imx6, icepi, butterstick]
        core: [main]
        core: [main, pin]
    steps:
      - uses: actions/checkout@v4
        with: { path: harness-repo }
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: main
          path: core
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Core under test
        run: |
          cd core
          if [ "${{ matrix.core }}" = pin ]; then git fetch -q origin pin/bus-lanes-branch-via-layer && git checkout -q FETCH_HEAD; fi
          echo "CORE $(git log --oneline -1)"
          echo "BENCH $(grep -o '"version": *"[^"]*"' node_modules/@tscircuit/core-ddr-benchmark/package.json 2>/dev/null)"
          bun install --ignore-scripts > /dev/null
          echo "PINS $(grep -o '"@tscircuit/bus-lanes-solver": "[^"]*"' package.json) $(grep -o 'core-ddr-benchmark#[0-9a-f]*' package.json)"
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: 2718df9b52937392f648612ca4a31d6352b585a5
          path: solver
          persist-credentials: false
      - name: Build bus-lanes main and place it in Core
        run: |
          cd solver
          bun install > /dev/null 2>&1
          bun run build 2>&1 | tail -2
          echo "BUSLANES core-installed=$(grep '"version"' ../core/node_modules/@tscircuit/bus-lanes-solver/package.json)"
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: dc19141bc92b21a52cb42aced8699e7ddb978924
          fetch-depth: 0
          path: autorouter
          persist-credentials: false
      - name: Build the autorouter under test and place it in Core
        run: |
          cd autorouter
          git status --short
          bun install > /dev/null 2>&1
          bun run build > build.log 2>&1; tail -3 build.log
          grep '"version"' ../core/node_modules/@tscircuit/capacity-autorouter/package.json
          rm -rf ../core/node_modules/@tscircuit/capacity-autorouter/dist
          cp -r dist ../core/node_modules/@tscircuit/capacity-autorouter/dist
      - name: Route
        run: |
          cd core
          bun run benchmark:ddr --circuit ${{ matrix.circuit }} --timeout 1800 > route.log 2>&1 || true
          tail -12 route.log
          grep -h "kept\|nets, " route.log | tail -3
          grep -h "P9DIAG" ddr-benchmark-results/${{ matrix.circuit }}/render.log | cut -c1-220 | head -300
      - name: Print the report
        if: always()
        run: |
          cd core
          echo "=====REPORT====="
          cat ddr-benchmark-results/report.md
          echo "=====END-REPORT====="
          grep -iE "No path|ran out|AutorouterError" route.log | cut -c1-300 | head -5
          cd ddr-benchmark-results/${{ matrix.circuit }}
          for a in routing matching; do
            echo "=====ATTEMPT $a====="
            [ -f attempts/$a/progress.json ] || { echo "ATTEMPT $a missing"; continue; }
            A=$a bun -e 'const a=process.env.A; const p=JSON.parse(require("fs").readFileSync(`attempts/${a}/progress.json`,"utf8")); for (const x of p.phases) console.log(`ATTEMPT ${a} PHASE ${x.phase} | ${x.solver} | ${x.status} | dur=${x.durationMs==null?"-":(x.durationMs/1000).toFixed(1)+"s"} | conns=${x.connections}`); console.log(`ATTEMPT ${a} ERRORS ${JSON.stringify(p.errors).slice(0,300)}`)'
          done
          mkdir -p ../../../out; tar -czf ../../../out/phases.tgz attempts 2>/dev/null || true
      - name: Push the phase files to a branch
        if: always()
        run: |
          cd harness-repo
          git config user.name harness-bot; git config user.email harness-bot@users.noreply.github.com
          B=phases/${{ matrix.circuit }}-core-${{ matrix.core }}
          git checkout -q --orphan $B; git rm -rq --cached .; git clean -fdq
          cp ../out/phases.tgz . && git add phases.tgz && git commit -qm "phase files" && git push -f origin $B
